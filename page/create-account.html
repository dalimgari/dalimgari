<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
</head>
<body>
  <main>
    <form>
      <input id="name" type="text" name="name" placeholder="Name" autocomplete="name">
      <input id="email-phone" type="text" name="email-phone" placeholder="Email / Phone Number" autocomplete="username">
      <input id="password" type="password" name="password" placeholder="Password" autocomplete="new-password">
      <input id="confirm-password" type="password" name="confirm-password" placeholder="Confirm Password" autocomplete="new-password">
      <button type="submit">Create Account</button>
    </form>
  </main>
  <script src="../controller/controller.js"></script>
</body>
</html>
