name: React migration preview checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-preview-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Normalize migration source and generate lockfile artifact
        run: |
          npx prettier --write "src/**/*.{ts,tsx,css}" "tests/e2e/**/*.ts"
      - name: Upload formatted source and dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: react-migration-normalized-source
          path: |
            src/
            tests/e2e/
            package-lock.json
          if-no-files-found: error
      - name: Check legacy behavior and preview structure
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Prettier formatting
        run: npm run format:check
      - name: TypeScript check
        run: npm run typecheck
      - name: Build isolated React preview
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:e2e
