name: React migration preview checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: react-preview-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Normalize migration source and generate lockfile artifact
        run: |
          npx prettier --write "src/**/*.{ts,tsx,css}" "tests/e2e/**/*.ts"
      - name: Upload formatted source and dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: react-migration-normalized-source
          path: |
            src/
            tests/e2e/
            package-lock.json
          if-no-files-found: error
      - name: Check legacy behavior and preview structure
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Prettier formatting
        run: npm run format:check
      - name: TypeScript check
        run: npm run typecheck
      - name: Build isolated React preview
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:e2e
      - name: Commit verified formatting and dependency lockfile
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/ tests/e2e/
          if git diff --cached --quiet; then
            echo "No formatting or lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: format React migration and lock dependencies"
          git diff --binary "$GITHUB_SHA" HEAD > /tmp/react-migration-generated.patch
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          rm -f package-lock.json
          git apply /tmp/react-migration-generated.patch
          git add package-lock.json src/ tests/e2e/
          git commit -m "chore: apply verified React migration formatting and lockfile"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$TARGET_BRANCH"
