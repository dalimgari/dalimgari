name: Bootstrap npm lockfile

on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "package.json"
      - ".github/workflows/bootstrap-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: startsWith(github.ref, 'refs/heads/rebuild/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "Lockfile is already tracked and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: add npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
