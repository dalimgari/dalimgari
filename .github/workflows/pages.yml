name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add global loader to all pages
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = '<script src="global/loader/loader.js"></script>'

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or 'global/components' in path.as_posix():
                  continue
              text = path.read_text(encoding='utf-8')
              if loader not in text:
                  text = text.replace('</body>', f'  {loader}\n</body>')
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
