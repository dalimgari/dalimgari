name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-apply global loader to pages
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            if ! grep -q 'global/loader/loader.js' "$file"; then
              sed -i 's#</body>#  <script src="global/loader/loader.js"></script>\n</body>#' "$file"
            fi
          done < <(find . -type f -name '*.html' -not -path './global/components/*' -print0)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
