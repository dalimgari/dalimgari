name: Restore global CSS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stylesheet from known-good commit
        run: |
          git checkout 13e4acec6eace9be479377a82b2063ca26a5ec52 -- src/style/global/global.css
          cat >> src/style/global/global.css <<'EOF'

/* Search must fit inside the responsive header without changing its natural height. */
.website-header:has(.public-search.is-open),
.website-header:has(.public-search.is-preparing){
  min-height:inherit !important;
  height:auto !important;
  box-sizing:border-box;
}
@media(max-width:760px){
  .website-header:has(.public-search.is-open),
  .website-header:has(.public-search.is-preparing){
    min-height:inherit !important;
    height:auto !important;
    box-sizing:border-box;
  }
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style/global/global.css
          git diff --cached --quiet && exit 0
          git commit -m "Restore global stylesheet and keep responsive header height [skip ci]"
          git push
