name: Deploy village website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage public website files
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/backup/' \
            --exclude='/docs/' \
            --exclude='/tests/' \
            --exclude='/supabase/' \
            --exclude='/node_modules/' \
            --exclude='/_site/' \
            --exclude='/.gitignore' \
            --exclude='/.editorconfig' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README*' \
            --exclude='/LICENSE*'
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
