name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dalimgari-pages-deploy
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: restore global stylesheet and preserve responsive header sizing
        run: |
          git checkout 13e4acec6eace9be479377a82b2063ca26a5ec52 -- src/style/global/global.css
          cat >> src/style/global/global.css <<'EOF'

/* Search fits inside the responsive header without changing its natural height. */
.website-header:has(.public-search.is-open),
.website-header:has(.public-search.is-preparing){
  min-height:inherit !important;
  height:auto !important;
  box-sizing:border-box;
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style/global/global.css
          if ! git diff --cached --quiet; then
            git commit -m "Restore global stylesheet and responsive header sizing [skip ci]"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: verify supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL repository secret"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing Supabase publishable/anon key repository secret"; exit 1; }
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
