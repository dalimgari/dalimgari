name: Development Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kztdiqknvrsgucbywpbv.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZFT5hHgIM3BxA7Js0vmZBA_hb8-8JPV
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate development sitemap
        run: npm run generate:sitemap

      - name: Build development site
        run: npm run build

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html
