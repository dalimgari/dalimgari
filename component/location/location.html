<article class="location-widget card" data-location-widget>
  <div class="location-widget__head">
    <div>
      <span class="eyebrow" data-i18n="home.location">Community location</span>
      <h2 data-location-name>Dalimgari</h2>
      <p data-location-detail>—</p>
    </div>
  </div>
  <div class="location-widget__map-wrap" data-location-map>
    <iframe class="location-widget__map" data-location-map-frame title="Community location on Google Maps" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="location-widget__map-fallback" data-location-map-fallback hidden>Google Maps could not be embedded. Use the coordinates below to open the location in Google Maps.</div>
  </div>
  <div class="location-widget__coordinates" data-location-coordinates>—</div>
  <a class="location-widget__open" data-location-open target="_blank" rel="noopener noreferrer" hidden>Open in Google Maps</a>
</article>
