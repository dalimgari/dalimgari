<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="global-style.css">
  <link rel="stylesheet" href="context/header.css">
  <link rel="stylesheet" href="context/content.css">
  <link rel="stylesheet" href="context/sidebar.css">
  <link rel="stylesheet" href="component/menu.css">
  <link rel="stylesheet" href="component/button.css">
  <link rel="stylesheet" href="component/input.css">
  <link rel="stylesheet" href="component/output.css">
  <link rel="stylesheet" href="component/avatar.css">
  <link rel="stylesheet" href="component/tab.css">
</head>
<body>
  <div data-context="header"></div>
  <div data-context="content"></div>
  <div data-context="sidebar"></div>

  <script>
    const contexts = [
      ["header", "context/header.html"],
      ["content", "context/content.html"],
      ["sidebar", "context/sidebar.html"]
    ];

    const states = {
      home: "Home",
      login: "Login",
      "create-account": "Create Account",
      "reset-password": "Reset Password",
      profile: "Profile",
      dashboard: "Dashboard"
    };

    async function loadContext(target, path) {
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      document.querySelector('[data-context="' + target + '"]').outerHTML = await response.text();
    }

    async function loadState() {
      const state = location.hash.slice(1) || "home";
      const name = states[state] ? state : "home";
      const content = document.querySelector("[data-layout='content']");
      const stateName = document.querySelector("[data-state-name]");

      try {
        const response = await fetch("content/" + name + ".html", { cache: "no-cache" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        content.innerHTML = await response.text();
        stateName.textContent = states[name];
      } catch (error) {
        console.error("Failed to load content/" + name + ".html", error);
      }
    }

    async function init() {
      try {
        await Promise.all(contexts.map(([target, path]) => loadContext(target, path)));
        await loadState();
        await import("./component/menu.js");
      } catch (error) {
        console.error("Failed to load page contexts", error);
      }
    }

    window.addEventListener("hashchange", loadState);
    init();
  </script>
</body>
</html>
