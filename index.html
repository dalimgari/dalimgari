<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>
  <div data-layout="header"></div>
  <main data-layout="content"></main>
  <aside data-layout="sidebar"></aside>

  <script>
    const layouts = {
      header: "context/header.html",
      content: "context/content.html",
      sidebar: "context/sidebar.html"
    };

    Object.entries(layouts).forEach(async ([region, path]) => {
      const target = document.querySelector(`[data-layout="${region}"]`);
      const response = await fetch(path);
      if (response.ok) target.innerHTML = await response.text();
    });
  </script>
</body>
</html>
