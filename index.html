<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      margin: 0;
    }

    header {
      height: 60px;
      background: #000;
    }

    button {
      padding: 8px 12px;
    }

    aside {
      width: 250px;
      height: 100vh;
      background: #000;
      display: none;
    }

    aside.open {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <button type="button" id="menu-button">Menu</button>
  </header>

  <aside id="sidebar"></aside>

  <script>
    document.getElementById("menu-button").onclick = function () {
      document.getElementById("sidebar").classList.toggle("open");
    };
  </script>

</body>
</html>
