<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      margin: 0;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: sticky;
      top: 12px;
      z-index: 10;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.16);
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      background-color: #f5f5f5;
      outline: none;
    }

    .menu-button span {
      display: block;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background-color: #333333;
    }

    .floating-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(260px, calc(100vw - 32px));
      padding: 8px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background-color: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }

    .floating-menu[hidden] {
      display: none;
    }

    .menu-link {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #333333;
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible,
    .menu-link[aria-current="page"] {
      background-color: #f3f4f6;
      color: #111827;
      outline: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    .login-form {
      width: min(100% - 32px, 400px);
      padding: 28px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .login-title {
      margin: 0 0 20px;
      color: #222222;
      font-size: 24px;
      line-height: 1.3;
    }

    .login-field {
      display: block;
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid #dcdcdc;
      border-radius: 9px;
      background: #ffffff;
      color: #222222;
      font: inherit;
      font-size: 15px;
    }

    .login-field:focus {
      border-color: #777777;
      outline: 2px solid rgba(0, 0, 0, 0.06);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #444444;
      font-size: 14px;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #222222;
      cursor: pointer;
    }

    .remember-row label {
      cursor: pointer;
    }

    .forgot-password {
      display: block;
      margin: 2px 0 20px;
      color: #333333;
      font-size: 14px;
      text-align: right;
      text-decoration: none;
    }

    .forgot-password:hover,
    .create-account:hover {
      text-decoration: underline;
    }

    .login-submit {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #444444;
    }

    .login-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 14px 0 0;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-message:empty {
      display: none;
    }

    .login-message::before {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .login-message[data-type="error"] {
      color: #a12622;
      background: #fff4f2;
      border-color: #f6d5d1;
    }

    .login-message[data-type="error"]::before { content: "×"; }

    .login-message[data-type="success"] {
      color: #176b43;
      background: #effaf3;
      border-color: #ccebd7;
    }

    .login-message[data-type="success"]::before { content: "✓"; }

    .login-message[data-type="info"] {
      color: #245b8f;
      background: #f1f7ff;
      border-color: #d7e8fb;
    }

    .login-message[data-type="info"]::before { content: "i"; }

    .message-link {
      display: inline-block;
      margin-left: 4px;
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .create-account {
      display: block;
      margin-top: 20px;
      color: #333333;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }


    .profile-page,.message-page{width:min(100% - 32px,760px);margin:28px auto;padding:24px;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .profile-heading,.message-heading{margin:0 0 20px;color:#222;font-size:24px}
    .profile-summary{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:#f8f9fb;margin-bottom:20px}
    .profile-avatar{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e5e7eb;color:#374151;font-size:24px;font-weight:700}.profile-avatar img{width:100%;height:100%;object-fit:cover}.avatar-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.avatar-upload{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .profile-name{margin:0 0 5px;font-size:20px;overflow-wrap:anywhere}.profile-email{margin:0;color:#666;font-size:14px;overflow-wrap:anywhere}
    .role-badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#244a8f;font-size:10px;vertical-align:middle;letter-spacing:.4px}
    .profile-section{padding:18px;margin-bottom:16px;border:1px solid #eee;border-radius:12px}.profile-section h2{margin:0 0 14px;font-size:17px}
    .profile-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.detail-label{margin:0 0 5px;color:#777;font-size:12px}.detail-value{margin:0;color:#222;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
    .profile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.action-button{min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;font:inherit;font-weight:600;cursor:pointer}.action-button.primary{background:#222;border-color:#222;color:#fff}
    .profile-input,.message-textarea{width:100%;margin:0 0 15px;padding:12px 13px;border:1px solid #dcdcdc;border-radius:9px;background:#fff;color:#222;font:inherit;font-size:15px}.message-textarea{min-height:160px;resize:vertical}
    .edit-profile-form label,.message-page label{display:block;margin:0 0 6px;color:#444;font-size:14px}.profile-status{margin:12px 0;font-size:14px;line-height:1.5}.back-profile{margin-bottom:18px}.attachment-note{margin:-6px 0 15px;color:#777;font-size:13px}
    @media(max-width:560px){.profile-page,.message-page{padding:17px;margin:18px auto}.profile-details{grid-template-columns:1fr}.profile-actions .action-button{flex:1 1 100%}.profile-heading,.message-heading{font-size:22px}}

    footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #fafafa;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.035);
      color: #777777;
      font-size: 13px;
      letter-spacing: 0.2px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="floating-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="floating-menu" id="floating-menu" aria-label="Main menu" hidden>
      <button class="menu-link" type="button" data-page="Profile">Profile</button>
      <button class="menu-link" type="button" data-page="Login">Login</button>
    </nav>
  </header>

  <main id="main-content" aria-live="polite">
  </main>

  <footer>
    © 2026 Dalimgari. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yopfogoyjxwxplnabqii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGZvZ295anh3eHBsbmFicWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMyNjQsImV4cCI6MjEwNDg2OTI2NH0.dIVH8sp3qyD_AGmt1bNFVOpQKdrgcX734HkrEuOacB4"
    );

    const menuButton = document.querySelector(".menu-button");
    const floatingMenu = document.querySelector("#floating-menu");
    const mainContent = document.querySelector("#main-content");
    const menuLinks = document.querySelectorAll(".menu-link");

    function renderPage(pageName) {
      mainContent.replaceChildren();

      if (pageName === "CreateAccount") { renderCreateAccount(); return; }
      if (pageName === "Profile") { renderProfile(); return; }
      if (pageName === "EditProfile") { renderEditProfile(); return; }
      if (pageName === "Message") { renderMessage(); return; }
      if (pageName !== "Login") return;

      const form = document.createElement("form");
      form.className = "login-form";
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = form.querySelector(".login-submit");
        const message = form.querySelector(".login-message");
        submitButton.disabled = true;
        submitButton.textContent = "Logging in...";
        message.textContent = "";
        message.removeAttribute("data-type");

        let loginResult;
        try {
          loginResult = await supabaseClient.auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
        } catch (error) {
          loginResult = { error };
        }

        const { error } = loginResult;
        if (error) {
          const errorText = (error.message || "").toLowerCase();
          message.dataset.type = "error";
          if (errorText.includes("invalid login credentials")) {
            message.textContent = "Email or password is incorrect.";
          } else if (errorText.includes("email not confirmed")) {
            message.textContent = "Please confirm your email before logging in.";
          } else if (errorText.includes("rate limit") || errorText.includes("too many requests")) {
            message.textContent = "Too many attempts. Please wait a little and try again.";
          } else if (errorText.includes("fetch") || errorText.includes("network")) {
            message.textContent = "Connection problem. Check your internet and try again.";
          } else {
            message.textContent = "We couldn’t log you in. Please try again.";
          }
          submitButton.disabled = false;
          submitButton.textContent = "Login";
          return;
        }

        if (remember.checked) {
          localStorage.setItem("dalimgari-remember-email", "true");
          localStorage.setItem("dalimgari-saved-email", email.value.trim());
        } else {
          localStorage.removeItem("dalimgari-remember-email");
          localStorage.removeItem("dalimgari-saved-email");
        }

        renderPage("Profile");
        menuLinks.forEach((item) => {
          if (item.dataset.page === "Profile") {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });
      });

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;
      if (localStorage.getItem("dalimgari-remember-email") === "true") {
        email.value = localStorage.getItem("dalimgari-saved-email") || "";
      }

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "password";
      password.placeholder = "Password";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "current-password";
      password.required = true;

      const rememberRow = document.createElement("div");
      rememberRow.className = "remember-row";

      const remember = document.createElement("input");
      remember.type = "checkbox";
      remember.id = "remember-password";
      remember.name = "remember-password";
      remember.checked = localStorage.getItem("dalimgari-remember-email") === "true";

      const rememberLabel = document.createElement("label");
      rememberLabel.htmlFor = "remember-password";
      rememberLabel.textContent = "Remember me";

      rememberRow.append(remember, rememberLabel);

      const forgot = document.createElement("a");
      forgot.className = "forgot-password";
      forgot.href = "forgot-password.html";
      forgot.textContent = "Forgot password?";

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Login";

      const createAccount = document.createElement("a");
      createAccount.className = "create-account";
      createAccount.href = "#create-account";
      createAccount.textContent = "Create new account?";
      createAccount.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("CreateAccount");
        menuLinks.forEach((item) => item.removeAttribute("aria-current"));
        history.replaceState(null, "", "#create-account");
      });

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "alert");

      form.append(email, password, rememberRow, forgot, submit, message, createAccount);
      mainContent.append(form);
    }


    function renderCreateAccount() {
      const form = document.createElement("form");
      form.className = "login-form";

      const heading = document.createElement("h1");
      heading.className = "login-title";
      heading.textContent = "Create New Account";

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "signup-email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "signup-password";
      password.placeholder = "Password (at least 8 characters)";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "new-password";
      password.minLength = 8;
      password.required = true;

      const confirmPassword = document.createElement("input");
      confirmPassword.className = "login-field";
      confirmPassword.type = "password";
      confirmPassword.name = "confirm-password";
      confirmPassword.placeholder = "Confirm Password";
      confirmPassword.setAttribute("aria-label", "Confirm Password");
      confirmPassword.autocomplete = "new-password";
      confirmPassword.minLength = 8;
      confirmPassword.required = true;

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Create Account";

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "status");
      message.setAttribute("aria-live", "polite");

      const backToLogin = document.createElement("a");
      backToLogin.className = "create-account";
      backToLogin.href = "#login";
      backToLogin.textContent = "Already have an account? Login";
      backToLogin.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("Login");
        history.replaceState(null, "", "#login");
      });

      form.append(heading, email, password, confirmPassword, submit, message, backToLogin);
      mainContent.append(form);

      function setStatus(text, type) {
        message.dataset.type = type;
        message.replaceChildren(document.createTextNode(text));
      }

      function showExistingAccountMessage() {
        setStatus("This email may already be registered. Reset your password to continue.", "info");
        const resetLink = document.createElement("a");
        resetLink.className = "message-link";
        resetLink.href = "forgot-password.html";
        resetLink.textContent = "Reset password";
        message.append(resetLink);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("", "error");

        if (password.value.length < 8) {
          setStatus("Use at least 8 characters for your password.", "error");
          password.focus();
          return;
        }
        if (password.value !== confirmPassword.value) {
          setStatus("Passwords don’t match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Creating Account...";

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              emailRedirectTo: "https://dalimgari.github.io/dalimgari/#login"
            }
          });

          if (error) {
            const errorText = (error.message || "").toLowerCase();
            if (
              errorText.includes("already registered") ||
              errorText.includes("already exists") ||
              errorText.includes("user already")
            ) {
              showExistingAccountMessage();
            } else {
              const errorText = (error.message || "").toLowerCase();
              if (errorText.includes("rate limit") || errorText.includes("email rate limit")) {
                setStatus("Email limit reached. Please try again after one hour.", "error");
              } else if (errorText.includes("password")) {
                setStatus("Please choose a stronger valid password.", "error");
              } else if (errorText.includes("fetch") || errorText.includes("network")) {
                setStatus("Connection problem. Check your internet and try again.", "error");
              } else {
                setStatus("We couldn’t create your account. Please check your details and try again.", "error");
              }
            }
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          // Supabase can return an obfuscated user with no identities when
          // the submitted email already belongs to an account.
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
            showExistingAccountMessage();
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          if (data.session) {
            setStatus("Your account is ready.", "success");
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            return;
          }

          setStatus("Check your inbox to confirm your email.", "success");
          form.reset();
          submit.disabled = false;
          submit.textContent = "Create Account";
        } catch (error) {
          setStatus("Connection problem. Please try again.", "error");
          submit.disabled = false;
          submit.textContent = "Create Account";
        }
      });
    }


    function setCurrentMenuPage(pageName) {
      menuLinks.forEach((item) => item.dataset.page === pageName ? item.setAttribute("aria-current", "page") : item.removeAttribute("aria-current"));
    }
    async function getCurrentUser() {
      const { data } = await supabaseClient.auth.getUser();
      return data.user || null;
    }
    function metadataValue(user, key) { return (user.user_metadata && user.user_metadata[key]) || ""; }

    async function renderProfile() {
      const user = await getCurrentUser();
      if (!user) { renderPage("Login"); history.replaceState(null, "", "#login"); setCurrentMenuPage("Login"); return; }
      const name = metadataValue(user, "full_name") || metadataValue(user, "name") || "";
      const role = user.app_metadata && String(user.app_metadata.role || "").toLowerCase() === "admin" ? "ADMIN" : "MEMBER";
      const page = document.createElement("section"); page.className = "profile-page";
      const heading = document.createElement("h1"); heading.className = "profile-heading"; heading.textContent = "My Profile";
      const summary = document.createElement("div"); summary.className = "profile-summary";
      const avatar = document.createElement("div"); avatar.className = "profile-avatar";
      const avatarUrl = metadataValue(user, "avatar_url");
      if (avatarUrl) { const avatarImage = document.createElement("img"); avatarImage.src = avatarUrl; avatarImage.alt = "Profile picture"; avatar.append(avatarImage); }
      else { avatar.textContent = name.charAt(0).toUpperCase() || "?"; }
      const identity = document.createElement("div");
      const nameLine = document.createElement("h2"); nameLine.className = "profile-name"; nameLine.append(document.createTextNode(name || "Not added"));
      const badge = document.createElement("span"); badge.className = "role-badge"; badge.textContent = role; nameLine.append(badge);
      const email = document.createElement("p"); email.className = "profile-email"; email.textContent = user.email || "";
      identity.append(nameLine, email);
      summary.append(avatar, identity);
      const info = document.createElement("section"); info.className = "profile-section";
      const infoHeading = document.createElement("h2"); infoHeading.textContent = "Profile Information";
      const details = document.createElement("div"); details.className = "profile-details";
      [["Full Name",name],["Phone Number",metadataValue(user,"phone")||"Not added"],["Date of Birth",metadataValue(user,"date_of_birth")||"Not added"],["Bio",metadataValue(user,"bio")||"No bio yet"]].forEach(([label,value])=>{
        const item=document.createElement("div"), l=document.createElement("p"), v=document.createElement("p");
        l.className="detail-label";l.textContent=label;v.className="detail-value";v.textContent=value;item.append(l,v);details.append(item);
      });
      info.append(infoHeading,details);
      const actions=document.createElement("div");actions.className="profile-actions";
      const edit=document.createElement("button");edit.className="action-button primary";edit.textContent="Edit Profile";edit.type="button";
      edit.addEventListener("click",()=>{renderPage("EditProfile");history.replaceState(null,"","#edit-profile");});
      const msg=document.createElement("button");msg.className="action-button";msg.textContent="Message";msg.type="button";
      msg.addEventListener("click",()=>{renderPage("Message");history.replaceState(null,"","#message");});
      const logout=document.createElement("button");logout.className="action-button";logout.textContent="Logout";logout.type="button";
      logout.addEventListener("click",async()=>{const {error}=await supabaseClient.auth.signOut();if(!error){renderPage("Login");history.replaceState(null,"","#login");setCurrentMenuPage("Login");}});
      actions.append(edit,msg,logout);page.append(heading,summary,info,actions);mainContent.replaceChildren(page);setCurrentMenuPage("Profile");
    }

    async function renderEditProfile() {
      const user=await getCurrentUser();
      if(!user){renderPage("Login");history.replaceState(null,"","#login");return;}
      const page=document.createElement("section");page.className="profile-page";
      const heading=document.createElement("h1");heading.className="profile-heading";heading.textContent="Edit Profile";
      const form=document.createElement("form");form.className="edit-profile-form";
      function field(labelText,name,type,value){
        const label=document.createElement("label");label.htmlFor="edit-"+name;label.textContent=labelText;
        let input;if(type==="textarea"){input=document.createElement("textarea");input.rows=4;}else{input=document.createElement("input");input.type=type;}
        input.className="profile-input";input.id="edit-"+name;input.name=name;input.value=value||"";form.append(label,input);return input;
      }
      const fullName=field("Full Name","full_name","text",metadataValue(user,"full_name")||metadataValue(user,"name"));
      const avatarSection = document.createElement("div"); avatarSection.style.marginBottom = "16px";
      const avatarLabel = document.createElement("label"); avatarLabel.textContent = "Profile Picture";
      const avatarPreview = document.createElement("div"); avatarPreview.className = "profile-avatar"; avatarPreview.style.margin = "8px 0 12px";
      const currentAvatarUrl = metadataValue(user, "avatar_url");
      if (currentAvatarUrl) { const previewImage = document.createElement("img"); previewImage.src = currentAvatarUrl; previewImage.alt = "Profile picture"; avatarPreview.append(previewImage); }
      else { avatarPreview.textContent = (metadataValue(user, "full_name") || metadataValue(user, "name") || (user.email || "M").split("@")[0]).charAt(0).toUpperCase(); }
      const pictureInput = document.createElement("input"); pictureInput.type = "file"; pictureInput.accept = "image/*"; pictureInput.className = "profile-input"; pictureInput.setAttribute("aria-label", "Choose profile picture");
      const pictureStatus = document.createElement("p"); pictureStatus.className = "profile-status"; pictureStatus.setAttribute("role", "status");
      pictureInput.addEventListener("change", async () => {
        const file = pictureInput.files && pictureInput.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) { pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Please select an image file."; pictureInput.value = ""; return; }
        pictureInput.disabled = true; pictureStatus.style.color = ""; pictureStatus.textContent = "Updating profile picture...";
        let objectUrl = "";
        try {
          const image = new Image(); objectUrl = URL.createObjectURL(file);
          await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; image.src = objectUrl; });
          const canvas = document.createElement("canvas"); canvas.width = 256; canvas.height = 256;
          const context = canvas.getContext("2d"); const side = Math.min(image.naturalWidth, image.naturalHeight);
          context.drawImage(image, (image.naturalWidth - side) / 2, (image.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
          const compressedImage = canvas.toDataURL("image/jpeg", 0.8);
          const { error } = await supabaseClient.auth.updateUser({ data: { avatar_url: compressedImage } });
          if (error) throw error;
          pictureStatus.style.color = "#176b43"; pictureStatus.textContent = "Profile picture updated.";
          avatarPreview.replaceChildren(); const previewImage = document.createElement("img"); previewImage.src = compressedImage; previewImage.alt = "Profile picture"; avatarPreview.append(previewImage);
        } catch (error) {
          pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Could not update your profile picture. Please try another image.";
        } finally {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          pictureInput.disabled = false; pictureInput.value = "";
        }
      });
      avatarSection.append(avatarLabel, avatarPreview, pictureInput, pictureStatus);
      form.append(avatarSection);
      field("Phone Number","phone","tel",metadataValue(user,"phone"));
      field("Date of Birth","date_of_birth","date",metadataValue(user,"date_of_birth"));
      field("Bio","bio","textarea",metadataValue(user,"bio"));
      const status=document.createElement("p");status.className="profile-status";status.setAttribute("role","status");
      const actions=document.createElement("div");actions.className="profile-actions";
      const save=document.createElement("button");save.className="action-button primary";save.type="submit";save.textContent="Save Changes";
      const cancel=document.createElement("button");cancel.className="action-button";cancel.type="button";cancel.textContent="Cancel";
      cancel.addEventListener("click",()=>{renderPage("Profile");history.replaceState(null,"","#profile");});
      actions.append(save,cancel);form.append(status,actions);
      form.addEventListener("submit",async(event)=>{
        event.preventDefault();save.disabled=true;save.textContent="Saving...";
        const {error}=await supabaseClient.auth.updateUser({data:{full_name:fullName.value.trim(),phone:form.elements.phone.value.trim(),date_of_birth:form.elements.date_of_birth.value,bio:form.elements.bio.value.trim()}});
        if(error){status.style.color="#a12622";status.textContent="Could not save your profile. Please try again.";save.disabled=false;save.textContent="Save Changes";return;}
        renderPage("Profile");history.replaceState(null,"","#profile");
      });
      page.append(heading,form);mainContent.replaceChildren(page);
    }

    async function renderMessage() {
      const user=await getCurrentUser();
      if(!user){renderPage("Login");history.replaceState(null,"","#login");return;}
      const page=document.createElement("section");page.className="message-page";
      const back=document.createElement("button");back.className="action-button back-profile";back.type="button";back.textContent="← Back to Profile";
      back.addEventListener("click",()=>{renderPage("Profile");history.replaceState(null,"","#profile");});
      const heading=document.createElement("h1");heading.className="message-heading";heading.textContent="Message to Admin";
      const form=document.createElement("form");
      const textArea=document.createElement("textarea");textArea.className="message-textarea";textArea.name="message";textArea.placeholder="Write your message here...";textArea.setAttribute("aria-label","Message to admin");
      const label=document.createElement("label");label.htmlFor="admin-message-attachment";label.textContent="Attach photo or image (optional)";
      const file=document.createElement("input");file.type="file";file.id="admin-message-attachment";file.accept="image/*";file.style.display="block";file.style.marginBottom="12px";
      const send=document.createElement("button");send.className="action-button primary";send.type="button";send.textContent="Send Message";send.disabled=true;
      form.append(textArea,label,file,send);page.append(back,heading,form);mainContent.replaceChildren(page);
    }

    // When email verification completes, Supabase exchanges the callback code
    // for a session and emits SIGNED_IN. Open the Profile automatically.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        menuLinks.forEach((item) => {
          if (item.dataset.page === "Profile") item.setAttribute("aria-current", "page");
          else item.removeAttribute("aria-current");
        });
      }
    });

    if (window.location.hash === "#create-account") {
      renderPage("CreateAccount");
    } else if (window.location.hash === "#login") {
      renderPage("Login");
      menuLinks.forEach((item) => {
        if (item.dataset.page === "Login") item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
      });
    }

    menuLinks.forEach((link) => {
      link.addEventListener("click", () => {
        const pageName = link.dataset.page;
        renderPage(pageName);

        menuLinks.forEach((item) => {
          if (item === link) {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });

        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      });
    });

    menuButton.addEventListener("click", () => {
      const isOpening = floatingMenu.hidden;
      floatingMenu.hidden = !isOpening;
      menuButton.setAttribute("aria-expanded", String(isOpening));
      menuButton.setAttribute("aria-label", isOpening ? "Close menu" : "Open menu");
    });

    document.addEventListener("click", (event) => {
      if (!menuButton.contains(event.target) && !floatingMenu.contains(event.target)) {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });
  </script>
</body>
</html>
