<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <link rel="stylesheet" href="style/global-style.css">
  <link rel="stylesheet" href="context/header.css">
  <link rel="stylesheet" href="context/sidebar.css">
  <link rel="stylesheet" href="context/content.css">
  <link rel="stylesheet" href="component/menu/menu.css">
  <link rel="stylesheet" href="component/avatar/avatar.css">
</head>
<body>
  <div data-context="header"></div>
  <div data-context="sidebar"></div>
  <main data-context="content"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const contexts = [
      ["header", "context/header.html"],
      ["sidebar", "context/sidebar.html"],
      ["content", "context/content.html"]
    ];

    async function loadContext(target, path) {
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      document.querySelector('[data-context="' + target + '"]').outerHTML =
        await response.text();
    }

    async function loadComponent(target, path) {
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      document.querySelector('[data-component="' + target + '"]').outerHTML =
        await response.text();
    }

    function loadScript(path) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = path;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }

    function syncHeaderHeight() {
      const header = document.querySelector('[data-layout="header"]');
      if (!header) return;

      const height = header.getBoundingClientRect().height;
      document.documentElement.style.setProperty("--header-height", height + "px");
    }

    async function init() {
      await Promise.all(
        contexts.map(([target, path]) => loadContext(target, path))
      );

      await Promise.all([
        loadComponent("menu", "component/menu/menu.html"),
        loadComponent("avatar", "component/avatar/avatar.html")
      ]);

      await loadScript("component/menu/menu.js");
      await loadScript("context/content.js");
      await loadScript("supabase/client/supabase.js");
      await loadScript("supabase/auth/auth.js");

      syncHeaderHeight();

      const header = document.querySelector('[data-layout="header"]');
      if (header && "ResizeObserver" in window) {
        new ResizeObserver(syncHeaderHeight).observe(header);
      } else {
        window.addEventListener("resize", syncHeaderHeight);
      }
    }

    init().catch(console.error);
  </script>
</body>
</html>
