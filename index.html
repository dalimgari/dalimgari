<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      margin: 0;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: sticky;
      top: 12px;
      z-index: 10;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.16);
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      background-color: #f5f5f5;
      outline: none;
    }

    .menu-button span {
      display: block;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background-color: #333333;
    }

    .floating-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(260px, calc(100vw - 32px));
      padding: 8px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background-color: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }

    .floating-menu[hidden] {
      display: none;
    }

    .menu-link {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #333333;
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible,
    .menu-link[aria-current="page"] {
      background-color: #f3f4f6;
      color: #111827;
      outline: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    .login-form {
      width: min(100% - 32px, 400px);
      padding: 28px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .login-title {
      margin: 0 0 20px;
      color: #222222;
      font-size: 24px;
      line-height: 1.3;
    }

    .login-field {
      display: block;
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid #dcdcdc;
      border-radius: 9px;
      background: #ffffff;
      color: #222222;
      font: inherit;
      font-size: 15px;
    }

    .login-field:focus {
      border-color: #777777;
      outline: 2px solid rgba(0, 0, 0, 0.06);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #444444;
      font-size: 14px;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #222222;
      cursor: pointer;
    }

    .remember-row label {
      cursor: pointer;
    }

    .forgot-password {
      display: block;
      margin: 2px 0 20px;
      color: #333333;
      font-size: 14px;
      text-align: right;
      text-decoration: none;
    }

    .forgot-password:hover,
    .create-account:hover {
      text-decoration: underline;
    }

    .login-submit {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #444444;
    }

    .login-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 14px 0 0;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-message:empty {
      display: none;
    }

    .login-message::before {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .login-message[data-type="error"] {
      color: #a12622;
      background: #fff4f2;
      border-color: #f6d5d1;
    }

    .login-message[data-type="error"]::before { content: "×"; }

    .login-message[data-type="success"] {
      color: #176b43;
      background: #effaf3;
      border-color: #ccebd7;
    }

    .login-message[data-type="success"]::before { content: "✓"; }

    .login-message[data-type="info"] {
      color: #245b8f;
      background: #f1f7ff;
      border-color: #d7e8fb;
    }

    .login-message[data-type="info"]::before { content: "i"; }

    .create-account {
      display: block;
      margin-top: 20px;
      color: #333333;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }


    .profile-page{width:min(100% - 32px,760px);margin:28px auto;padding:24px;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .profile-heading{margin:0 0 20px;color:#222;font-size:24px}
    .profile-summary{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:#f8f9fb;margin-bottom:20px}
    .profile-avatar{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e5e7eb;color:#374151;font-size:24px;font-weight:700}.profile-avatar img{width:100%;height:100%;object-fit:cover}.avatar-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.avatar-upload{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .profile-name{margin:0 0 5px;font-size:20px;overflow-wrap:anywhere}.profile-email{margin:0;color:#666;font-size:14px;overflow-wrap:anywhere}
    .role-badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#244a8f;font-size:10px;vertical-align:middle;letter-spacing:.4px}
    .profile-section{padding:18px;margin-bottom:16px;border:1px solid #eee;border-radius:12px}.profile-section h2{margin:0 0 14px;font-size:17px}
    .profile-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.detail-label{margin:0 0 5px;color:#777;font-size:12px}.detail-value{margin:0;color:#222;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
    .profile-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:18px}.action-button{min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;font:inherit;font-weight:600;cursor:pointer}.action-button.primary{background:#222;border-color:#222;color:#fff}
    .profile-input{width:100%;margin:0 0 15px;padding:12px 13px;border:1px solid #dcdcdc;border-radius:9px;background:#fff;color:#222;font:inherit;font-size:15px}
    .profile-picture-editor{margin-bottom:20px;background:linear-gradient(135deg,#fbfdff,#f7f9fc)}
    .profile-picture-editor h2{margin-bottom:16px}
    .profile-picture-editor-row{display:flex;align-items:center;gap:20px}
    .profile-avatar-large{width:104px;height:104px;flex:0 0 104px;font-size:36px;border:3px solid #fff;box-shadow:0 3px 14px rgba(15,23,42,.12)}
    .profile-picture-upload-area{min-width:0;flex:1}
    .profile-picture-picker{margin:0 0 12px;padding:12px;gap:10px}
    .profile-picture-picker .attachment-icon{flex-basis:38px;width:38px;height:38px}
    .profile-picture-picker .attachment-button{white-space:nowrap}
    .profile-picture-picker.is-uploading{opacity:.75;cursor:wait}
    .profile-picture-picker .avatar-upload{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .profile-picture-progress{margin:0 0 10px}
    .profile-picture-progress[hidden]{display:none}
    .profile-picture-progress.is-active .attachment-progress-fill{width:35%;animation:profile-picture-progress 1.2s ease-in-out infinite alternate}
    @keyframes profile-picture-progress{from{transform:translateX(-15%)}to{transform:translateX(140%)}}
    @media(max-width:480px){.profile-picture-editor-row{align-items:flex-start;flex-direction:column;gap:14px}.profile-picture-upload-area{width:100%}.profile-avatar-large{width:88px;height:88px;flex-basis:88px}}
    .edit-profile-form label{display:block;margin:0 0 6px;color:#444;font-size:14px}.profile-status{margin:12px 0;font-size:14px;line-height:1.5}.back-profile{margin-bottom:18px}.attachment-note{margin:-6px 0 15px;color:#777;font-size:13px}
    .attachment-picker{display:flex;align-items:center;gap:14px;margin:4px 0 18px;padding:16px;border:1px dashed #bfc5ce;border-radius:12px;background:#f8fafc;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
    .attachment-picker:hover,.attachment-picker:focus-within{border-color:#64748b;background:#f1f5f9}
    .attachment-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:#e9eef5;color:#334155;font-size:23px}
    .attachment-copy{min-width:0;flex:1}.attachment-title{display:block;margin:0 0 4px;color:#222;font-size:14px;font-weight:600}.attachment-subtitle{display:block;color:#6b7280;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .attachment-button{flex:0 0 auto;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#222;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .attachment-button:hover{background:#f3f4f6}.attachment-filename{margin:-8px 0 14px;color:#475569;font-size:13px;overflow-wrap:anywhere}
    .attachment-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:560px){.profile-page{padding:17px;margin:18px auto}.profile-details{grid-template-columns:1fr}.profile-actions .action-button{flex:1 1 100%}.profile-heading{font-size:22px}}

    .dashboard-page {
      display: block;
      align-self: flex-start;
      width: calc(100% - 32px);
      max-width: 1200px;
      margin: 28px auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .dashboard-heading {
      margin: 0 0 18px;
      color: #222222;
      font-size: 26px;
      line-height: 1.3;
    }

    .dashboard-navigation-area {
      width: 100%;
      margin: 0 0 22px;
      padding: 12px 0 16px;
      border-bottom: 1px solid #eeeeee;
    }

    .dashboard-navigation {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 8px;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #c7c7c7 #f5f5f5;
    }

    .dashboard-nav-button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #dedede;
      border-radius: 999px;
      background: #ffffff;
      color: #333333;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .dashboard-nav-button:hover,
    .dashboard-nav-button:focus-visible {
      border-color: #999999;
      outline: none;
    }

    .dashboard-nav-button[aria-selected="true"] {
      border-color: #222222;
      background: #222222;
      color: #ffffff;
    }

    .dashboard-section-content {
      min-height: 220px;
      padding: 22px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .dashboard-section-title {
      margin: 0 0 10px;
      color: #222222;
      font-size: 21px;
      line-height: 1.35;
    }

    .dashboard-section-description {
      margin: 0;
      color: #666666;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .dashboard-page {
        width: calc(100% - 24px);
        margin: 20px auto;
      }

      .dashboard-navigation-area {
        margin-bottom: 16px;
        padding-top: 8px;
      }

      .dashboard-navigation {
        gap: 8px;
      }

      .dashboard-nav-button {
        min-height: 40px;
        padding: 0 14px;
        font-size: 13px;
      }

      .dashboard-section-content {
        min-height: 180px;
        padding: 17px;
      }
    }


    .dashboard-crud { display:grid; gap:22px; }
    .dashboard-crud-card { padding:18px; border:1px solid #e5e7eb; border-radius:12px; background:#fff; }
    .dashboard-crud-card h3 { margin:0 0 16px; font-size:17px; color:#222; }
    .dashboard-crud-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .dashboard-crud-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .dashboard-crud-field.full { grid-column:1/-1; }
    .dashboard-crud-field label { color:#444; font-size:13px; font-weight:600; }
    .dashboard-crud-input { width:100%; min-height:42px; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#222; font:inherit; font-size:14px; }
    .dashboard-crud-input:focus { outline:2px solid #dbeafe; border-color:#64748b; }
    .dashboard-crud-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; }
    .dashboard-crud-status { min-height:20px; margin:12px 0 0; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
    .dashboard-crud-list { width:100%; overflow-x:auto; }
    .dashboard-crud-table { width:100%; border-collapse:collapse; font-size:13px; }
    .dashboard-crud-table th,.dashboard-crud-table td { padding:11px 10px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
    .dashboard-crud-table th { color:#555; background:#f8fafc; white-space:nowrap; }
    .dashboard-crud-row { cursor:pointer; }
    .dashboard-crud-row:hover,.dashboard-crud-row.is-selected { background:#f1f5f9; }
    .dashboard-crud-row:focus { outline:2px solid #94a3b8; outline-offset:-2px; }
    .dashboard-crud-empty { padding:20px 10px; color:#777; text-align:center; }
    .dashboard-crud-preview { max-width:100%; max-height:220px; border-radius:8px; margin-top:8px; }
    .dashboard-crud-hint { margin:0 0 14px; color:#666; font-size:13px; line-height:1.5; }
    @media(max-width:600px) { .dashboard-crud-form { grid-template-columns:1fr; } .dashboard-crud-field.full { grid-column:auto; } .dashboard-crud-card { padding:14px; } }

    footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #fafafa;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.035);
      color: #777777;
      font-size: 13px;
      letter-spacing: 0.2px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="floating-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="floating-menu" id="floating-menu" aria-label="Main menu" hidden>
      <button class="menu-link" type="button" data-page="Profile">Profile</button>
      <button class="menu-link" type="button" data-page="Login">Login</button>
    </nav>
  </header>

  <main id="main-content" aria-live="polite">
  </main>

  <footer>
    © 2026 Dalimgari. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yopfogoyjxwxplnabqii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGZvZ295anh3eHBsbmFicWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMyNjQsImV4cCI6MjEwNDg2OTI2NH0.dIVH8sp3qyD_AGmt1bNFVOpQKdrgcX734HkrEuOacB4"
    );

    const menuButton = document.querySelector(".menu-button");
    const floatingMenu = document.querySelector("#floating-menu");
    const mainContent = document.querySelector("#main-content");
    const menuLinks = document.querySelectorAll(".menu-link");

    let activeSession = null;

    function updateAuthMenu(session) {
      activeSession = session || null;
      const authLink = Array.from(menuLinks).find((item) =>
        item.dataset.page === "Login" || item.dataset.page === "Logout"
      );
      if (!authLink) return;
      if (activeSession) {
        authLink.dataset.page = "Logout";
        authLink.textContent = "Logout";
      } else {
        authLink.dataset.page = "Login";
        authLink.textContent = "Login";
      }
    }

    function renderPage(pageName) {
      if (activeSession && (pageName === "Login" || pageName === "CreateAccount")) {
        pageName = "Profile";
        history.replaceState(null, "", "#profile");
      }
      mainContent.replaceChildren();

      if (pageName === "CreateAccount") { renderCreateAccount(); return; }
      if (pageName === "Profile") { renderProfile(); return; }
      if (pageName === "EditProfile") { renderEditProfile(); return; }
      if (pageName === "Dashboard") { renderDashboard(); return; }
      if (pageName !== "Login") return;

      const form = document.createElement("form");
      form.className = "login-form";
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = form.querySelector(".login-submit");
        const message = form.querySelector(".login-message");
        submitButton.disabled = true;
        submitButton.textContent = "Logging in...";
        message.textContent = "";
        message.removeAttribute("data-type");

        let loginResult;
        try {
          loginResult = await supabaseClient.auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
        } catch (error) {
          loginResult = { error };
        }

        const { error } = loginResult;
        if (error) {
          const errorText = (error.message || "").toLowerCase();
          message.dataset.type = "error";
          if (errorText.includes("invalid login credentials")) {
            message.textContent = "Email or password is incorrect.";
          } else if (errorText.includes("email not confirmed")) {
            message.textContent = "Please confirm your email before logging in.";
          } else if (errorText.includes("rate limit") || errorText.includes("too many requests")) {
            message.textContent = "Too many attempts. Please wait a little and try again.";
          } else if (errorText.includes("fetch") || errorText.includes("network")) {
            message.textContent = "Connection problem. Check your internet and try again.";
          } else {
            message.textContent = "We couldn’t log you in. Please try again.";
          }
          submitButton.disabled = false;
          submitButton.textContent = "Login";
          return;
        }

        if (remember.checked) {
          localStorage.setItem("dalimgari-remember-email", "true");
          localStorage.setItem("dalimgari-saved-email", email.value.trim());
        } else {
          localStorage.removeItem("dalimgari-remember-email");
          localStorage.removeItem("dalimgari-saved-email");
        }

        renderPage("Profile");
        menuLinks.forEach((item) => {
          if (item.dataset.page === "Profile") {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });
      });

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;
      if (localStorage.getItem("dalimgari-remember-email") === "true") {
        email.value = localStorage.getItem("dalimgari-saved-email") || "";
      }

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "password";
      password.placeholder = "Password";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "current-password";
      password.required = true;

      const rememberRow = document.createElement("div");
      rememberRow.className = "remember-row";

      const remember = document.createElement("input");
      remember.type = "checkbox";
      remember.id = "remember-password";
      remember.name = "remember-password";
      remember.checked = localStorage.getItem("dalimgari-remember-email") === "true";

      const rememberLabel = document.createElement("label");
      rememberLabel.htmlFor = "remember-password";
      rememberLabel.textContent = "Remember me";

      rememberRow.append(remember, rememberLabel);

      const forgot = document.createElement("a");
      forgot.className = "forgot-password";
      forgot.href = "forgot-password.html";
      forgot.textContent = "Forgot password?";

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Login";

      const createAccount = document.createElement("a");
      createAccount.className = "create-account";
      createAccount.href = "#create-account";
      createAccount.textContent = "Create new account?";
      createAccount.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("CreateAccount");
        menuLinks.forEach((item) => item.removeAttribute("aria-current"));
        history.replaceState(null, "", "#create-account");
      });

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "alert");

      form.append(email, password, rememberRow, forgot, submit, message, createAccount);
      mainContent.append(form);
    }


    function renderCreateAccount() {
      const form = document.createElement("form");
      form.className = "login-form";

      const heading = document.createElement("h1");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("", "error");

        if (password.value.length < 8) {
          setStatus("Use at least 8 characters for your password.", "error");
          password.focus();
          return;
        }
        if (password.value !== confirmPassword.value) {
          setStatus("Passwords don’t match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Creating Account...";

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              emailRedirectTo: "https://dalimgari.github.io/dalimgari/#login"
            }
          });

          if (error) {
            const errorText = (error.message || "").toLowerCase();
            if (
              errorText.includes("already registered") ||
              errorText.includes("already exists") ||
              errorText.includes("user already")
            ) {
              showExistingAccountMessage();
            } else {
              const errorText = (error.message || "").toLowerCase();
              if (errorText.includes("rate limit") || errorText.includes("email rate limit")) {
                setStatus("Email limit reached. Please try again after one hour.", "error");
              } else if (errorText.includes("password")) {
                setStatus("Please choose a stronger valid password.", "error");
              } else if (errorText.includes("fetch") || errorText.includes("network")) {
                setStatus("Connection problem. Check your internet and try again.", "error");
              } else {
                setStatus("We couldn’t create your account. Please check your details and try again.", "error");
              }
            }
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          // Supabase can return an obfuscated user with no identities when
          // the submitted email already belongs to an account.
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
            showExistingAccountMessage();
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          if (data.session) {
            setStatus("Your account is ready.", "success");
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            return;
          }

          setStatus("Check your inbox to confirm your email.", "success");
          form.reset();
          submit.disabled = false;
          submit.textContent = "Create Account";
        } catch (error) {
          setStatus("Connection problem. Please try again.", "error");
          submit.disabled = false;
          submit.textContent = "Create Account";
        }
      });

              supabaseClient.from("album_media").select("*").eq("media_id",selectedId)
            ]);
            if(posts.error)throw posts.error;if(albums.error)throw albums.error;
            related.post_media=posts.data||[];related.album_media=albums.data||[];
          }else if(tableName==="roles"){
            const [users,permissions]=await Promise.all([
              supabaseClient.from("user_roles").select("*").eq("role_id",selectedId),
              supabaseClient.from("role_permissions").select("*").eq("role_id",selectedId)
            ]);
            if(users.error)throw users.error;if(permissions.error)throw permissions.error;
            related.user_roles=users.data||[];related.role_permissions=permissions.data||[];
          }else if(tableName==="permissions"){
            const {data,error}=await supabaseClient.from("role_permissions").select("*").eq("permission_id",selectedId);if(error)throw error;
            related.role_permissions=data||[];
          }
          const trashPayload={
            original_table:tableName,original_id:String(selectedId),record_data:record,related_data:related,
            storage_bucket:tableName==="media"&&record.storage_path?"site-media":null,
            storage_path:tableName==="media"?record.storage_path||null:null,
            deleted_by:user.id
          };
          const {data:trash,error:trashError}=await supabaseClient.from("recycle_bin").insert(trashPayload).select("id").single();
          if(trashError)throw trashError;trashId=trash.id;
          if(tableName==="posts"){const {error}=await supabaseClient.from("post_media").delete().eq("post_id",selectedId);if(error)throw error;}
          if(tableName==="albums"){
            const {error:linkError}=await supabaseClient.from("album_media").delete().eq("album_id",selectedId);if(linkError)throw linkError;
            const {error:postError}=await supabaseClient.from("posts").update({album_id:null}).eq("album_id",selectedId);if(postError)throw postError;
          }
          if(tableName==="media"){
            const {error:postError}=await supabaseClient.from("post_media").delete().eq("media_id",selectedId);if(postError)throw postError;
            const {error:albumError}=await supabaseClient.from("album_media").delete().eq("media_id",selectedId);if(albumError)throw albumError;
          }
          if(tableName==="roles"){
            const {error:userError}=await supabaseClient.from("user_roles").delete().eq("role_id",selectedId);if(userError)throw userError;
            const {error:permError}=await supabaseClient.from("role_permissions").delete().eq("role_id",selectedId);if(permError)throw permError;
          }
          if(tableName==="permissions"){const {error}=await supabaseClient.from("role_permissions").delete().eq("permission_id",selectedId);if(error)throw error;}
          const {error}=await supabaseClient.from(tableName).delete().eq("id",selectedId);if(error)throw error;
          resetForm();setStatus("Moved to Recycle Bin. Scheduled for permanent deletion in 30 days.","success");await loadRecords();
        }catch(error){
          if(trashId)console.warn("Recycle Bin entry retained for recovery after an incomplete move.",trashId);
          setStatus((error.message||"Could not move record to Recycle Bin.")+(trashId?" The recycle entry was kept so the operation can be recovered.":""),"error");
        }
        finally{save.disabled=false;remove.disabled=true;}
      });
      if(!isCurrent())return;
      resetForm();await loadRecords();
    }

    async function renderEditProfile() {
      const user=await getCurrentUser();
      if(!user){renderPage("Login");history.replaceState(null,"","#login");return;}
      const page=document.createElement("section");page.className="profile-page";
      const heading=document.createElement("h1");heading.className="profile-heading";heading.textContent="Edit Profile";
      const form=document.createElement("form");form.className="edit-profile-form";
      function field(labelText,name,type,value){
        const label=document.createElement("label");label.htmlFor="edit-"+name;label.textContent=labelText;
        let input;if(type==="textarea"){input=document.createElement("textarea");input.rows=4;}else{input=document.createElement("input");input.type=type;}
        input.className="profile-input";input.id="edit-"+name;input.name=name;input.value=value||"";form.append(label,input);return input;
      }
      const avatarSection = document.createElement("section"); avatarSection.className = "profile-section profile-picture-editor";
      const avatarHeading = document.createElement("h2"); avatarHeading.textContent = "Profile Picture";
      const avatarEditorRow = document.createElement("div"); avatarEditorRow.className = "profile-picture-editor-row";
      const avatarPreview = document.createElement("div"); avatarPreview.className = "profile-avatar profile-avatar-large";
      const currentAvatarUrl = metadataValue(user, "avatar_url");
      if (currentAvatarUrl) { const previewImage = document.createElement("img"); previewImage.src = currentAvatarUrl; previewImage.alt = "Profile picture"; avatarPreview.append(previewImage); }
      else { avatarPreview.textContent = (metadataValue(user, "full_name") || metadataValue(user, "name") || (user.email || "M").split("@")[0]).charAt(0).toUpperCase(); }
      const avatarUploadArea = document.createElement("div"); avatarUploadArea.className = "profile-picture-upload-area";
      const pictureInput = document.createElement("input"); pictureInput.type = "file"; pictureInput.accept = "image/*"; pictureInput.className = "avatar-upload"; pictureInput.setAttribute("aria-label", "Choose profile picture");
      const picturePicker = document.createElement("label"); picturePicker.className = "attachment-picker profile-picture-picker";
      const pictureIcon = document.createElement("span"); pictureIcon.className = "attachment-icon"; pictureIcon.setAttribute("aria-hidden", "true"); pictureIcon.textContent = "↑";
      const pictureCopy = document.createElement("span"); pictureCopy.className = "attachment-copy";
      const pictureTitle = document.createElement("span"); pictureTitle.className = "attachment-title"; pictureTitle.textContent = "Change profile picture";
      const pictureSubtitle = document.createElement("span"); pictureSubtitle.className = "attachment-subtitle"; pictureSubtitle.textContent = "Choose an image from your device";
      pictureCopy.append(pictureTitle, pictureSubtitle);
      const pictureButton = document.createElement("span"); pictureButton.className = "attachment-button"; pictureButton.textContent = "Choose image";
      picturePicker.append(pictureIcon, pictureCopy, pictureButton);
      const pictureFileName = document.createElement("p"); pictureFileName.className = "attachment-filename"; pictureFileName.hidden = true;
      const pictureProgress = document.createElement("div"); pictureProgress.className = "attachment-progress profile-picture-progress"; pictureProgress.hidden = true;
      const pictureProgressFill = document.createElement("div"); pictureProgressFill.className = "attachment-progress-fill";
      pictureProgress.append(pictureProgressFill);
      const pictureStatus = document.createElement("p"); pictureStatus.className = "profile-status message-send-status"; pictureStatus.setAttribute("role", "status"); pictureStatus.setAttribute("aria-live", "polite");
      picturePicker.htmlFor = "edit-profile-picture";
      pictureInput.id = "edit-profile-picture";
      picturePicker.append(pictureInput);
      avatarUploadArea.append(picturePicker, pictureFileName, pictureProgress, pictureStatus);
      avatarEditorRow.append(avatarPreview, avatarUploadArea);
      avatarSection.append(avatarHeading, avatarEditorRow);
      form.append(avatarSection);
      const fullName=field("Full Name","full_name","text",metadataValue(user,"full_name")||metadataValue(user,"name"));
      pictureInput.addEventListener("change", async () => {
        const file = pictureInput.files && pictureInput.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) { pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Please select an image file."; pictureInput.value = ""; return; }
        if (file.size > 10 * 1024 * 1024) { pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Image must be 10 MB or smaller."; pictureInput.value = ""; return; }
        pictureInput.disabled = true; picturePicker.classList.add("is-uploading"); pictureButton.textContent = "Processing…";
        pictureFileName.hidden = false; pictureFileName.textContent = file.name + " · " + formatProfileImageSize(file.size);
        pictureProgress.hidden = false; pictureProgress.classList.add("is-active"); pictureProgressFill.style.width = "35%";
        pictureStatus.style.color = "#245b8f"; pictureStatus.textContent = "Preparing your profile picture…";
        let objectUrl = "";
        try {
          const image = new Image(); objectUrl = URL.createObjectURL(file);
          await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; image.src = objectUrl; });
          const canvas = document.createElement("canvas"); canvas.width = 256; canvas.height = 256;
          const context = canvas.getContext("2d"); const side = Math.min(image.naturalWidth, image.naturalHeight);
          context.drawImage(image, (image.naturalWidth - side) / 2, (image.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
          const compressedImage = canvas.toDataURL("image/jpeg", 0.8);
          pictureStatus.textContent = "Saving your profile picture…"; pictureProgressFill.style.width = "70%";
          const { error } = await supabaseClient.auth.updateUser({ data: { avatar_url: compressedImage } });
          if (error) throw error;
          pictureProgressFill.style.width = "100%"; pictureProgress.classList.remove("is-active");
          pictureStatus.style.color = "#176b43"; pictureStatus.textContent = "✓ Profile picture updated successfully.";
          avatarPreview.replaceChildren(); const previewImage = document.createElement("img"); previewImage.src = compressedImage; previewImage.alt = "Profile picture"; avatarPreview.append(previewImage);
          pictureSubtitle.textContent = "Your new profile picture is saved";
        } catch (error) {
          pictureProgress.classList.remove("is-active"); pictureProgressFill.style.width = "0%";
          pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Could not update your profile picture. Please try another image.";
        } finally {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          pictureInput.disabled = false; picturePicker.classList.remove("is-uploading"); pictureButton.textContent = "Choose image"; pictureInput.value = "";
        }
      });
      field("Phone Number","phone","tel",metadataValue(user,"phone"));
      field("Date of Birth","date_of_birth","date",metadataValue(user,"date_of_birth"));
      field("Bio","bio","textarea",metadataValue(user,"bio"));
      const status=document.createElement("p");status.className="profile-status";status.setAttribute("role","status");
      const actions=document.createElement("div");actions.className="profile-actions";
      const save=document.createElement("button");save.className="action-button primary";save.type="submit";save.textContent="Save Changes";
      const cancel=document.createElement("button");cancel.className="action-button";cancel.type="button";cancel.textContent="Cancel";
      cancel.addEventListener("click",()=>{renderPage("Profile");history.replaceState(null,"","#profile");});
      actions.append(save,cancel);form.append(status,actions);
      form.addEventListener("submit",async(event)=>{
        event.preventDefault();save.disabled=true;save.textContent="Saving...";
        const {error}=await supabaseClient.auth.updateUser({data:{full_name:fullName.value.trim(),phone:form.elements.phone.value.trim(),date_of_birth:form.elements.date_of_birth.value,bio:form.elements.bio.value.trim()}});
        if(error){status.style.color="#a12622";status.textContent="Could not save your profile. Please try again.";save.disabled=false;save.textContent="Save Changes";return;}
        renderPage("Profile");history.replaceState(null,"","#profile");
      });
      page.append(heading,form);mainContent.replaceChildren(page);
    }

    // Keep menu actions synchronized with the real Supabase session.    // Keep menu actions synchronized with the real Supabase session.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      updateAuthMenu(session);
      if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      }
    });

    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      updateAuthMenu(data.session);
      if (data.session) {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      } else if (window.location.hash === "#create-account") {
        renderPage("CreateAccount");
      } else if (window.location.hash === "#login") {
        renderPage("Login");
        setCurrentMenuPage("Login");
      } else if (window.location.hash === "#dashboard") {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      }
    })();

    menuLinks.forEach((link) => {
      link.addEventListener("click", async () => {
        const pageName = link.dataset.page;
        if (pageName === "Logout") {
          link.disabled = true;
          link.textContent = "Logging out...";
          const { error } = await supabaseClient.auth.signOut();
          link.disabled = false;
          if (error) {
            link.textContent = "Logout";
            return;
          }
          updateAuthMenu(null);
          renderPage("Login");
          history.replaceState(null, "", "#login");
          setCurrentMenuPage("Login");
        } else {
          const { data } = await supabaseClient.auth.getSession();
          updateAuthMenu(data.session);
          if (data.session && (pageName === "Login" || pageName === "CreateAccount")) {
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            setCurrentMenuPage("Profile");
          } else {
            renderPage(pageName);
            setCurrentMenuPage(pageName);
          }
        }

        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      });
    });

    menuButton.addEventListener("click", () => {
      const isOpening = floatingMenu.hidden;
      floatingMenu.hidden = !isOpening;
      menuButton.setAttribute("aria-expanded", String(isOpening));
      menuButton.setAttribute("aria-label", isOpening ? "Close menu" : "Open menu");
    });

    document.addEventListener("click", (event) => {
      if (!menuButton.contains(event.target) && !floatingMenu.contains(event.target)) {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });
  </script>
</body>
