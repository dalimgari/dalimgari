<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="global-stylesheet.css">
</head>
<body>
  <header data-layout="header"></header>

  <main data-layout="content"></main>

  <aside data-layout="sidebar" class="sidebar"></aside>

  <script>
    async function loadLayouts() {
      const layouts = {
        header: "context/header.html",
        content: "context/content.html",
        sidebar: "context/sidebar.html"
      };

      for (const [region, path] of Object.entries(layouts)) {
        const target = document.querySelector(`[data-layout="${region}"]`);
        try {
          const response = await fetch(path, { cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          target.innerHTML = await response.text();
        } catch (error) {
          console.error(`Failed to load ${path}`, error);
        }
      }

      const menuButton = document.querySelector("[data-menu-toggle]");
      const sidebar = document.querySelector("[data-layout='sidebar']");

      menuButton?.addEventListener("click", () => {
        sidebar.classList.toggle("is-open");
      });
    }

    loadLayouts();
  </script>
</body>
</html>
