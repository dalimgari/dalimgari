<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      margin: 0;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: sticky;
      top: 12px;
      z-index: 10;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.16);
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      background-color: #f5f5f5;
      outline: none;
    }

    .menu-button span {
      display: block;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background-color: #333333;
    }

    .floating-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(260px, calc(100vw - 32px));
      padding: 8px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background-color: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }

    .floating-menu[hidden] {
      display: none;
    }

    .menu-link {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #333333;
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible,
    .menu-link[aria-current="page"] {
      background-color: #f3f4f6;
      color: #111827;
      outline: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    .login-form {
      width: min(100% - 32px, 400px);
      padding: 28px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .login-title {
      margin: 0 0 20px;
      color: #222222;
      font-size: 24px;
      line-height: 1.3;
    }

    .login-field {
      display: block;
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid #dcdcdc;
      border-radius: 9px;
      background: #ffffff;
      color: #222222;
      font: inherit;
      font-size: 15px;
    }

    .login-field:focus {
      border-color: #777777;
      outline: 2px solid rgba(0, 0, 0, 0.06);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #444444;
      font-size: 14px;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #222222;
      cursor: pointer;
    }

    .remember-row label {
      cursor: pointer;
    }

    .forgot-password {
      display: block;
      margin: 2px 0 20px;
      color: #333333;
      font-size: 14px;
      text-align: right;
      text-decoration: none;
    }

    .forgot-password:hover,
    .create-account:hover {
      text-decoration: underline;
    }

    .login-submit {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #444444;
    }

    .login-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 14px 0 0;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-message:empty {
      display: none;
    }

    .login-message::before {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .login-message[data-type="error"] {
      color: #a12622;
      background: #fff4f2;
      border-color: #f6d5d1;
    }

    .login-message[data-type="error"]::before { content: "×"; }

    .login-message[data-type="success"] {
      color: #176b43;
      background: #effaf3;
      border-color: #ccebd7;
    }

    .login-message[data-type="success"]::before { content: "✓"; }

    .login-message[data-type="info"] {
      color: #245b8f;
      background: #f1f7ff;
      border-color: #d7e8fb;
    }

    .login-message[data-type="info"]::before { content: "i"; }

    .message-link {
      display: inline-block;
      margin-left: 4px;
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .create-account {
      display: block;
      margin-top: 20px;
      color: #333333;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }


    .profile-page,.message-page{width:min(100% - 32px,760px);margin:28px auto;padding:24px;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .profile-heading,.message-heading{margin:0 0 20px;color:#222;font-size:24px}
    .profile-summary{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:#f8f9fb;margin-bottom:20px}
    .profile-avatar{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e5e7eb;color:#374151;font-size:24px;font-weight:700}.profile-avatar img{width:100%;height:100%;object-fit:cover}.avatar-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.avatar-upload{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .profile-name{margin:0 0 5px;font-size:20px;overflow-wrap:anywhere}.profile-email{margin:0;color:#666;font-size:14px;overflow-wrap:anywhere}
    .role-badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#244a8f;font-size:10px;vertical-align:middle;letter-spacing:.4px}
    .profile-section{padding:18px;margin-bottom:16px;border:1px solid #eee;border-radius:12px}.profile-section h2{margin:0 0 14px;font-size:17px}
    .profile-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.detail-label{margin:0 0 5px;color:#777;font-size:12px}.detail-value{margin:0;color:#222;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
    .profile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.action-button{min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;font:inherit;font-weight:600;cursor:pointer}.action-button.primary{background:#222;border-color:#222;color:#fff}
    .profile-input,.message-textarea{width:100%;margin:0 0 15px;padding:12px 13px;border:1px solid #dcdcdc;border-radius:9px;background:#fff;color:#222;font:inherit;font-size:15px}.message-textarea{min-height:160px;resize:vertical}
    .edit-profile-form label,.message-page label{display:block;margin:0 0 6px;color:#444;font-size:14px}.profile-status{margin:12px 0;font-size:14px;line-height:1.5}.back-profile{margin-bottom:18px}.attachment-note{margin:-6px 0 15px;color:#777;font-size:13px}
    .attachment-picker{display:flex;align-items:center;gap:14px;margin:4px 0 18px;padding:16px;border:1px dashed #bfc5ce;border-radius:12px;background:#f8fafc;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
    .attachment-picker:hover,.attachment-picker:focus-within{border-color:#64748b;background:#f1f5f9}
    .attachment-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:#e9eef5;color:#334155;font-size:23px}
    .attachment-copy{min-width:0;flex:1}.attachment-title{display:block;margin:0 0 4px;color:#222;font-size:14px;font-weight:600}.attachment-subtitle{display:block;color:#6b7280;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .attachment-button{flex:0 0 auto;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#222;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .attachment-button:hover{background:#f3f4f6}.attachment-filename{margin:-8px 0 14px;color:#475569;font-size:13px;overflow-wrap:anywhere}
    .attachment-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .message-retention-notice{margin:0 0 22px;padding:14px 16px;border:1px solid #dbeafe;border-radius:12px;background:#eff6ff;color:#1e40af;text-align:center;font-size:14px;font-weight:600;line-height:1.6}
    .message-quota{margin:4px 0 18px;padding:13px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}
    .message-quota-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:#4b5563;font-size:13px}
    .message-quota-track{height:7px;overflow:hidden;border-radius:999px;background:#e5e7eb}
    .message-quota-fill{width:0;height:100%;border-radius:999px;background:#475569;transition:width .2s ease}
    .message-send-status{margin:12px 0 0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .attachment-list{display:grid;gap:9px;margin:-4px 0 18px}
    .attachment-item{padding:10px 12px;border:1px solid #e5e7eb;border-radius:9px;background:#fafafa}
    .attachment-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:7px;font-size:13px}
    .attachment-item-name{min-width:0;overflow-wrap:anywhere;color:#374151}
    .attachment-item-state{flex:0 0 auto;color:#6b7280;font-size:12px}
    .attachment-progress{height:6px;overflow:hidden;border-radius:999px;background:#e5e7eb}
    .attachment-progress-fill{width:0;height:100%;border-radius:999px;background:#2563eb;transition:width .15s ease}
    .attachment-item[data-state="success"] .attachment-progress-fill{background:#16a34a}
    .attachment-item[data-state="error"] .attachment-progress-fill{background:#dc2626}
    .action-button.has-unread{background:#dc2626;border-color:#dc2626;color:#fff}.action-button.has-unread:hover{background:#b91c1c;border-color:#b91c1c}
    .message-recipient-wrap{margin:0 0 18px}.message-recipient-wrap label{display:block;margin:0 0 7px;color:#444;font-size:14px}
    .message-conversation-heading{margin:18px 0 12px;font-size:18px;color:#222}.message-conversation{display:grid;gap:10px;max-height:48vh;overflow:auto;margin:0 0 22px;padding:2px}
    .message-delivery-status{font-weight:600;color:#4b5563}
    .admin-message-card{padding:16px;margin:0 0 12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;overflow-wrap:anywhere}
    .admin-message-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:0 0 10px;color:#6b7280;font-size:12px}
    .admin-message-body{margin:0 0 12px;color:#222;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
    .admin-message-file{display:inline-block;margin:0 0 8px;color:#1d4ed8;font-size:14px;overflow-wrap:anywhere}
    @media(max-width:420px){.attachment-picker{gap:10px;padding:12px}.attachment-icon{flex-basis:38px;width:38px;height:38px}.attachment-button{padding:8px;font-size:12px}.message-quota-label{flex-direction:column;gap:4px}}
    @media(max-width:560px){.profile-page,.message-page{padding:17px;margin:18px auto}.profile-details{grid-template-columns:1fr}.profile-actions .action-button{flex:1 1 100%}.profile-heading,.message-heading{font-size:22px}}

    footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #fafafa;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.035);
      color: #777777;
      font-size: 13px;
      letter-spacing: 0.2px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="floating-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="floating-menu" id="floating-menu" aria-label="Main menu" hidden>
      <button class="menu-link" type="button" data-page="Profile">Profile</button>
      <button class="menu-link" type="button" data-page="Login">Login</button>
    </nav>
  </header>

  <main id="main-content" aria-live="polite">
  </main>

  <footer>
    © 2026 Dalimgari. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yopfogoyjxwxplnabqii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGZvZ295anh3eHBsbmFicWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMyNjQsImV4cCI6MjEwNDg2OTI2NH0.dIVH8sp3qyD_AGmt1bNFVOpQKdrgcX734HkrEuOacB4"
    );

    const menuButton = document.querySelector(".menu-button");
    const floatingMenu = document.querySelector("#floating-menu");
    const mainContent = document.querySelector("#main-content");
    const menuLinks = document.querySelectorAll(".menu-link");

    let activeSession = null;

    function updateAuthMenu(session) {
      activeSession = session || null;
      const authLink = Array.from(menuLinks).find((item) =>
        item.dataset.page === "Login" || item.dataset.page === "Logout"
      );
      if (!authLink) return;
      if (activeSession) {
        authLink.dataset.page = "Logout";
        authLink.textContent = "Logout";
      } else {
        authLink.dataset.page = "Login";
        authLink.textContent = "Login";
      }
    }

    function renderPage(pageName) {
      if (activeSession && (pageName === "Login" || pageName === "CreateAccount")) {
        pageName = "Profile";
        history.replaceState(null, "", "#profile");
      }
      mainContent.replaceChildren();

      if (pageName === "CreateAccount") { renderCreateAccount(); return; }
      if (pageName === "Profile") { renderProfile(); return; }
      if (pageName === "EditProfile") { renderEditProfile(); return; }
      if (pageName === "Message") { renderMessage(); return; }
      if (pageName === "AdminInbox") { renderAdminInbox(); return; }
      if (pageName !== "Login") return;

      const form = document.createElement("form");
      form.className = "login-form";
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = form.querySelector(".login-submit");
        const message = form.querySelector(".login-message");
        submitButton.disabled = true;
        submitButton.textContent = "Logging in...";
        message.textContent = "";
        message.removeAttribute("data-type");

        let loginResult;
        try {
          loginResult = await supabaseClient.auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
        } catch (error) {
          loginResult = { error };
        }

        const { error } = loginResult;
        if (error) {
          const errorText = (error.message || "").toLowerCase();
          message.dataset.type = "error";
          if (errorText.includes("invalid login credentials")) {
            message.textContent = "Email or password is incorrect.";
          } else if (errorText.includes("email not confirmed")) {
            message.textContent = "Please confirm your email before logging in.";
          } else if (errorText.includes("rate limit") || errorText.includes("too many requests")) {
            message.textContent = "Too many attempts. Please wait a little and try again.";
          } else if (errorText.includes("fetch") || errorText.includes("network")) {
            message.textContent = "Connection problem. Check your internet and try again.";
          } else {
            message.textContent = "We couldn’t log you in. Please try again.";
          }
          submitButton.disabled = false;
          submitButton.textContent = "Login";
          return;
        }

        if (remember.checked) {
          localStorage.setItem("dalimgari-remember-email", "true");
          localStorage.setItem("dalimgari-saved-email", email.value.trim());
        } else {
          localStorage.removeItem("dalimgari-remember-email");
          localStorage.removeItem("dalimgari-saved-email");
        }

        renderPage("Profile");
        menuLinks.forEach((item) => {
          if (item.dataset.page === "Profile") {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });
      });

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;
      if (localStorage.getItem("dalimgari-remember-email") === "true") {
        email.value = localStorage.getItem("dalimgari-saved-email") || "";
      }

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "password";
      password.placeholder = "Password";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "current-password";
      password.required = true;

      const rememberRow = document.createElement("div");
      rememberRow.className = "remember-row";

      const remember = document.createElement("input");
      remember.type = "checkbox";
      remember.id = "remember-password";
      remember.name = "remember-password";
      remember.checked = localStorage.getItem("dalimgari-remember-email") === "true";

      const rememberLabel = document.createElement("label");
      rememberLabel.htmlFor = "remember-password";
      rememberLabel.textContent = "Remember me";

      rememberRow.append(remember, rememberLabel);

      const forgot = document.createElement("a");
      forgot.className = "forgot-password";
      forgot.href = "forgot-password.html";
      forgot.textContent = "Forgot password?";

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Login";

      const createAccount = document.createElement("a");
      createAccount.className = "create-account";
      createAccount.href = "#create-account";
      createAccount.textContent = "Create new account?";
      createAccount.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("CreateAccount");
        menuLinks.forEach((item) => item.removeAttribute("aria-current"));
        history.replaceState(null, "", "#create-account");
      });

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "alert");

      form.append(email, password, rememberRow, forgot, submit, message, createAccount);
      mainContent.append(form);
    }


    function renderCreateAccount() {
      const form = document.createElement("form");
      form.className = "login-form";

      const heading = document.createElement("h1");
      heading.className = "login-title";
      heading.textContent = "Create New Account";

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "signup-email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "signup-password";
      password.placeholder = "Password (at least 8 characters)";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "new-password";
      password.minLength = 8;
      password.required = true;

      const confirmPassword = document.createElement("input");
      confirmPassword.className = "login-field";
      confirmPassword.type = "password";
      confirmPassword.name = "confirm-password";
      confirmPassword.placeholder = "Confirm Password";
      confirmPassword.setAttribute("aria-label", "Confirm Password");
      confirmPassword.autocomplete = "new-password";
      confirmPassword.minLength = 8;
      confirmPassword.required = true;

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Create Account";

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "status");
      message.setAttribute("aria-live", "polite");

      const backToLogin = document.createElement("a");
      backToLogin.className = "create-account";
      backToLogin.href = "#login";
      backToLogin.textContent = "Already have an account? Login";
      backToLogin.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("Login");
        history.replaceState(null, "", "#login");
      });

      form.append(heading, email, password, confirmPassword, submit, message, backToLogin);
      mainContent.append(form);

      function setStatus(text, type) {
        message.dataset.type = type;
        message.replaceChildren(document.createTextNode(text));
      }

      function showExistingAccountMessage() {
        setStatus("This email may already be registered. Reset your password to continue.", "info");
        const resetLink = document.createElement("a");
        resetLink.className = "message-link";
        resetLink.href = "forgot-password.html";
        resetLink.textContent = "Reset password";
        message.append(resetLink);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("", "error");

        if (password.value.length < 8) {
          setStatus("Use at least 8 characters for your password.", "error");
          password.focus();
          return;
        }
        if (password.value !== confirmPassword.value) {
          setStatus("Passwords don’t match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Creating Account...";

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              emailRedirectTo: "https://dalimgari.github.io/dalimgari/#login"
            }
          });

          if (error) {
            const errorText = (error.message || "").toLowerCase();
            if (
              errorText.includes("already registered") ||
              errorText.includes("already exists") ||
              errorText.includes("user already")
            ) {
              showExistingAccountMessage();
            } else {
              const errorText = (error.message || "").toLowerCase();
              if (errorText.includes("rate limit") || errorText.includes("email rate limit")) {
                setStatus("Email limit reached. Please try again after one hour.", "error");

          }

          if (message.user_id === user.id) {
            const delivery = document.createElement("p");
            delivery.className = "admin-message-meta message-delivery-status";
            delivery.textContent = message.read_at
              ? "Seen · " + new Date(message.read_at).toLocaleString()
              : (message.delivered_at ? "Delivered · Unseen" : "Unseen");
            card.append(delivery);
          }
          const expiry = document.createElement("p");
          expiry.className = "admin-message-meta";
          expiry.textContent = "Auto-deletes: " + new Date(message.expires_at).toLocaleString();
          card.append(expiry);
          conversation.append(card);
        }
        conversation.scrollTop = conversation.scrollHeight;
        loadingConversation = false;
      }

      file.addEventListener("change", () => {
        selectedFiles = Array.from(file.files || []);
        const tooLarge = selectedFiles.find((selected) => selected.size > MAX_FILE_BYTES);
        if (tooLarge) {
          selectedFiles = [];
          file.value = "";
          renderSelectedFiles();
          attachmentSubtitle.textContent = "";
          setStatus("Each file can be up to 50 MB. The total limit for active messages and files is 100 MB.", "error");
          return;
        }
        renderSelectedFiles();
        const totalBytes = selectedFiles.reduce((sum, selected) => sum + selected.size, 0);
        attachmentSubtitle.textContent = selectedFiles.length ? selectedFiles.length + " images selected · " + formatBytes(totalBytes) : "";
        if (selectedFiles.length) setStatus("", "info");
      });

      if (isAdmin) {
        recipientSelect.addEventListener("change", () => {
          selectedRecipientId = recipientSelect.value || null;
          send.disabled = !selectedRecipientId;
          loadConversation();
        });
      }
      await refreshQuota();
      await loadConversation();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const messageText = textArea.value.trim();
        const filesToUpload = selectedFiles.slice();
        if (isAdmin && !selectedRecipientId) {
          setStatus("Select a registered user first.", "error");
          return;
        }
        if (!messageText && filesToUpload.length === 0) {
          setStatus("Enter a message or attach one or more images.", "error");
          return;
        }
        if (filesToUpload.some((selected) => selected.size > MAX_FILE_BYTES)) {
          setStatus("Each file can be up to 50 MB.", "error");
          return;
        }
        const textBytes = new TextEncoder().encode(messageText).length;
        const filesBytes = filesToUpload.reduce((sum, selected) => sum + selected.size, 0);
        if (usedBytes + textBytes + filesBytes > MAX_TOTAL_BYTES) {
          setStatus("This would exceed your 100 MB total limit. Space will be freed when older messages are deleted after 30 days.", "error");
          return;
        }
        send.disabled = true;
        file.disabled = true;
        textArea.disabled = true;
        send.textContent = "Uploading…";
        setStatus(filesToUpload.length ? "Starting file uploads…" : "Sending message…", "info");
        const uploadedPaths = [];
        try {
          if (filesToUpload.length) {
            const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
            const accessToken = sessionData?.session?.access_token;
            if (sessionError || !accessToken) throw new Error("Your session has expired. Please log in again and retry.");
            for (let i = 0; i < filesToUpload.length; i++) {
              const selected = filesToUpload[i];
              const safeName = selected.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-100) || "image";
              const uploadedPath = user.id + "/" + crypto.randomUUID() + "-" + safeName;
              updateFileProgress(selected, 0, "Uploading…", "uploading");
              await uploadFileWithProgress(uploadedPath, selected, i, filesToUpload.length, accessToken);
              uploadedPaths.push(uploadedPath);
            }
          }
          setStatus("All files uploaded. Sending message…", "info");
          send.textContent = "Sending…";
          const recipientId = isAdmin ? selectedRecipientId : null;
          const rows = filesToUpload.length
            ? filesToUpload.map((selected, index) => ({
                user_id: user.id,
                recipient_id: recipientId,
                message_text: index === 0 ? messageText : "",
                attachment_path: uploadedPaths[index],
                attachment_name: selected.name
              }))
            : [{
                user_id: user.id,
                recipient_id: recipientId,
                message_text: messageText,
                attachment_path: null,
                attachment_name: null
              }];
          const { error: insertError } = await supabaseClient.from("admin_messages").insert(rows);
          if (insertError) {
            if ((insertError.message || "").includes("MESSAGE_QUOTA_EXCEEDED")) {
              throw new Error("Your total 100 MB limit has been reached. You can send more after older messages are deleted in 30 days.");
            }
            throw new Error(insertError.message || insertError.details || insertError.hint || "Database insert failed");
          }
          textArea.value = "";
          file.value = "";
          selectedFiles = [];
          fileList.replaceChildren();
          fileList.hidden = true;
          attachmentSubtitle.textContent = "";
          setStatus(isAdmin ? "✓ Message sent successfully to the selected user." : "✓ Message sent successfully to the admin.", "success");
          await refreshQuota();
          await loadConversation();
        } catch (error) {
          if (uploadedPaths.length) await supabaseClient.storage.from("admin-message-attachments").remove(uploadedPaths);
          const errorText = error && error.message ? error.message : "";
          if (errorText.includes("Your total 100 MB") || errorText.includes("session has expired")) setStatus(errorText, "error");
          else if (errorText.includes("MESSAGE_QUOTA_EXCEEDED")) setStatus("Your total 100 MB limit has been reached. Please try again later.", "error");
          else if (errorText.toLowerCase().includes("size") || errorText.toLowerCase().includes("payload")) setStatus("File upload failed. Reduce the file size and try again.", "error");
          else {
            const detail = errorText && errorText.length < 220 ? errorText : "";
            setStatus(detail ? "Failed to send: " + detail : "Message or file could not be sent. Please try again.", "error");
          }
          selectedFiles.forEach((selected) => {
            if (selected._ui && selected._ui.item.dataset.state !== "success") updateFileProgress(selected, 0, "Failed", "error");
          });
        } finally {
          send.disabled = isAdmin && !selectedRecipientId;
          file.disabled = false;
          textArea.disabled = false;
          send.textContent = isAdmin ? "Send to User" : "Send Message";
        }
      });
    }

    // Keep menu actions synchronized with the real Supabase session.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      updateAuthMenu(session);
      if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      }
    });

    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      updateAuthMenu(data.session);
      if (data.session) {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      } else if (window.location.hash === "#create-account") {
        renderPage("CreateAccount");
      } else if (window.location.hash === "#login") {
        renderPage("Login");
        setCurrentMenuPage("Login");
      }
    })();

    menuLinks.forEach((link) => {
      link.addEventListener("click", async () => {
        const pageName = link.dataset.page;
        if (pageName === "Logout") {
          link.disabled = true;
          link.textContent = "Logging out...";
          const { error } = await supabaseClient.auth.signOut();
          link.disabled = false;
          if (error) {
            link.textContent = "Logout";
            return;
          }
          updateAuthMenu(null);
          renderPage("Login");
          history.replaceState(null, "", "#login");
          setCurrentMenuPage("Login");
        } else {
          const { data } = await supabaseClient.auth.getSession();
          updateAuthMenu(data.session);
          if (data.session && (pageName === "Login" || pageName === "CreateAccount")) {
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            setCurrentMenuPage("Profile");
          } else {
            renderPage(pageName);
            setCurrentMenuPage(pageName);
          }
        }

        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      });
    });

    menuButton.addEventListener("click", () => {
      const isOpening = floatingMenu.hidden;
      floatingMenu.hidden = !isOpening;
      menuButton.setAttribute("aria-expanded", String(isOpening));
      menuButton.setAttribute("aria-label", isOpening ? "Close menu" : "Open menu");
    });

    document.addEventListener("click", (event) => {
      if (!menuButton.contains(event.target) && !floatingMenu.contains(event.target)) {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });
  </script>
</body>
</html>
