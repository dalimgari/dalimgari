<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    /* Global responsive sizing and overflow protection for every page/component. */
    html, body { max-width:100%; }
    body { overflow-x:clip; }
    main, header, footer, main > * { min-width:0; max-width:100%; }
    img, video, canvas, iframe, object, embed { max-width:100%; }
    input, select, textarea, button, table, pre, code, output {
      max-width:100%;
    }
    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]),
    select, textarea {
      box-sizing:border-box;
      min-width:0;
      max-width:100%;
    }
    textarea {
      width:100%;
      height:auto;
      min-height:96px;
      max-height:60vh;
      overflow:auto;
      resize:vertical;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    button { overflow-wrap:anywhere; }
    table { max-width:100%; }
    th, td { overflow-wrap:anywhere; word-break:break-word; }
    pre, code, output { overflow-wrap:anywhere; }
    :is(input, select, textarea, button, a, [tabindex]):focus-visible {
      scroll-margin-block:24px;
      scroll-margin-inline:16px;
    }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      margin: 0;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: sticky;
      top: 12px;
      z-index: 10;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.16);
    }

    .current-page-label {
      min-width: 0;
      margin: 0 auto 0 0;
      padding-right: 16px;
      color: #222222;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .login-title,
    .profile-heading,
    .dashboard-heading {
      display: none;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      background-color: #f5f5f5;
      outline: none;
    }

    .menu-button span {
      display: block;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background-color: #333333;
    }

    .floating-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      box-sizing: border-box;
      width: clamp(176px, 42vw, 220px);
      max-width: calc(100vw - 24px);
      max-height: min(320px, calc(100vh - 96px));
      max-height: min(320px, calc(100dvh - 96px));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      border: 1px solid #eeeeee;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .floating-menu[hidden] {
      display: none;
    }

    .menu-link[hidden] {
      display: none;
    }

    .menu-link.menu-dashboard {
      margin-top: 10px;
      padding-top: 18px;
      border-top: 1px solid #eeeeee;
      border-radius: 0 0 9px 9px;
    }

    .menu-link {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #333333;
      font: inherit;
      font-size: 14px;
      line-height: 1.3;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible,
    .menu-link[aria-current="page"] {
      background-color: #f3f4f6;
      color: #111827;
      outline: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    .login-form {
      width: min(100% - 32px, 400px);
      padding: 28px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .login-title {
      margin: 0 0 20px;
      color: #222222;
      font-size: 24px;
      line-height: 1.3;
    }

    .login-field {
      display: block;
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid #dcdcdc;
      border-radius: 9px;
      background: #ffffff;
      color: #222222;
      font: inherit;
      font-size: 15px;
    }

    .login-field:focus {
      border-color: #777777;
      outline: 2px solid rgba(0, 0, 0, 0.06);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #444444;
      font-size: 14px;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #222222;
      cursor: pointer;
    }

    .remember-row label {
      cursor: pointer;
    }

    .forgot-password {
      display: block;
      margin: 2px 0 20px;
      color: #333333;
      font-size: 14px;
      text-align: right;
      text-decoration: none;
    }

    .forgot-password:hover,
    .create-account:hover {
      text-decoration: underline;
    }

    .login-submit {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #444444;
    }

    .login-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 14px 0 0;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-message:empty {
      display: none;
    }

    .login-message::before {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .login-message[data-type="error"] {
      color: #a12622;
      background: #fff4f2;
      border-color: #f6d5d1;
    }

    .login-message[data-type="error"]::before { content: "×"; }

    .login-message[data-type="success"] {
      color: #176b43;
      background: #effaf3;
      border-color: #ccebd7;
    }

    .login-message[data-type="success"]::before { content: "✓"; }

    .login-message[data-type="info"] {
      color: #245b8f;
      background: #f1f7ff;
      border-color: #d7e8fb;
    }

    .login-message[data-type="info"]::before { content: "i"; }

    .create-account {
      display: block;
      margin-top: 20px;
      color: #333333;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }


    .profile-page{width:min(100% - 32px,760px);margin:28px auto;padding:24px;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .profile-heading{margin:0 0 20px;color:#222;font-size:24px}
    .profile-summary{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:#f8f9fb;margin-bottom:20px}
    .profile-avatar{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e5e7eb;color:#374151;font-size:24px;font-weight:700}
    .profile-name{margin:0 0 5px;font-size:20px;overflow-wrap:anywhere}.profile-email{margin:0;color:#666;font-size:14px;overflow-wrap:anywhere}
    .role-badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#244a8f;font-size:10px;vertical-align:middle;letter-spacing:.4px}
    .profile-section{padding:18px;margin-bottom:16px;border:1px solid #eee;border-radius:12px}.profile-section h2{margin:0 0 14px;font-size:17px}
    .profile-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.detail-label{margin:0 0 5px;color:#777;font-size:12px}.detail-value{margin:0;color:#222;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
    .profile-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:18px}.action-button{min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;font:inherit;font-weight:600;cursor:pointer}.action-button.primary{background:#222;border-color:#222;color:#fff}
    .profile-input{width:100%;margin:0 0 15px;padding:12px 13px;border:1px solid #dcdcdc;border-radius:9px;background:#fff;color:#222;font:inherit;font-size:15px}
    .edit-profile-form label{display:block;margin:0 0 6px;color:#444;font-size:14px}.profile-status{margin:12px 0;font-size:14px;line-height:1.5}.back-profile{margin-bottom:18px}
    .profile-picture-editor{padding:16px;margin-bottom:18px;border:1px solid #eee;border-radius:12px;background:#f8f9fb}.profile-picture-row{display:flex;align-items:center;gap:16px}.profile-avatar-large{width:88px;height:88px;flex:0 0 88px;border:1px solid #eee}.profile-avatar img,.profile-avatar-large img{width:100%;height:100%;object-fit:cover}
    .profile-avatar img{display:block}.profile-picture-controls{min-width:0}.profile-picture-controls label{margin-bottom:8px}.profile-picture-controls input{max-width:100%}.profile-picture-status{font-size:13px;overflow-wrap:anywhere}@media(max-width:480px){.profile-picture-row{align-items:flex-start;flex-direction:column}}
    
    
    @media(max-width:560px){.profile-page{padding:17px;margin:18px auto}.profile-details{grid-template-columns:1fr}.profile-actions .action-button{flex:1 1 100%}.profile-heading{font-size:22px}}

    .dashboard-page {
      display: block;
      align-self: flex-start;
      width: calc(100% - 32px);
      max-width: 1200px;
      margin: 28px auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .dashboard-heading {
      margin: 0 0 18px;
      color: #222222;
      font-size: 26px;
      line-height: 1.3;
    }

    .dashboard-navigation-area {
      width: 100%;
      margin: 0 0 22px;
      padding: 12px 0 16px;
      border-bottom: 1px solid #eeeeee;
    }

    .dashboard-navigation {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 10px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 8px;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #c7c7c7 #f5f5f5;
    }

    .dashboard-nav-button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #dedede;
      border-radius: 999px;
      background: #ffffff;
      color: #333333;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .dashboard-nav-button:hover,
    .dashboard-nav-button:focus-visible {
      border-color: #999999;
      outline: none;
    }

    .dashboard-nav-button[aria-selected="true"] {
      border-color: #222222;
      background: #222222;
      color: #ffffff;
    }

    .dashboard-section-content {
      min-height: 220px;
      padding: 22px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .dashboard-section-title {
      margin: 0 0 10px;
      color: #222222;
      font-size: 21px;
      line-height: 1.35;
    }

    .dashboard-section-description {
      margin: 0;
      color: #666666;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .dashboard-page {
        width: calc(100% - 24px);
        margin: 20px auto;
      }

      .dashboard-navigation-area {
        margin-bottom: 16px;
        padding-top: 8px;
      }

      .dashboard-navigation {
        gap: 8px;
      }

      .dashboard-nav-button {
        min-height: 40px;
        padding: 0 14px;
        font-size: 13px;
      }

      .dashboard-section-content {
        min-height: 180px;
        padding: 17px;
      }
    }


    .dashboard-crud { display:grid; gap:22px; }
    .dashboard-crud-card { padding:18px; border:1px solid #e5e7eb; border-radius:12px; background:#fff; }
    .dashboard-crud-card h3 { margin:0 0 16px; font-size:17px; color:#222; }
    .dashboard-crud-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .dashboard-crud-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .dashboard-crud-field.full { grid-column:1/-1; }
    .dashboard-crud-field label { color:#444; font-size:13px; font-weight:600; }
    .dashboard-crud-input { width:100%; min-height:42px; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#222; font:inherit; font-size:14px; }
    .dashboard-crud-input:focus { outline:2px solid #dbeafe; border-color:#64748b; }
    .dashboard-crud-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; }
    .dashboard-crud-status { min-height:20px; margin:12px 0 0; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
    .dashboard-crud-list { width:100%; overflow-x:auto; }
    .dashboard-crud-table { width:100%; border-collapse:collapse; font-size:13px; }
    .dashboard-crud-table th,.dashboard-crud-table td { padding:11px 10px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
    .dashboard-crud-table th { color:#555; background:#f8fafc; white-space:nowrap; }
    .dashboard-crud-row { cursor:pointer; }
    .dashboard-crud-row:hover,.dashboard-crud-row.is-selected { background:#f1f5f9; }
    .dashboard-crud-row:focus { outline:2px solid #94a3b8; outline-offset:-2px; }
    .dashboard-crud-empty { padding:20px 10px; color:#777; text-align:center; }
    .dashboard-crud-hint { margin:0 0 14px; color:#666; font-size:13px; line-height:1.5; }
    @media(max-width:600px) { .dashboard-crud-form { grid-template-columns:1fr; } .dashboard-crud-field.full { grid-column:auto; } .dashboard-crud-card { padding:14px; } }

    /* Consistent sizing and overflow handling for every dashboard control. */
    .dashboard-page, .dashboard-page * { box-sizing:border-box; min-width:0; }
    .dashboard-page { max-width:100%; overflow-wrap:anywhere; }
    .dashboard-page button, .dashboard-page input, .dashboard-page select,
    .dashboard-page textarea, .dashboard-page table { max-width:100%; }
    .dashboard-page button { white-space:normal; overflow-wrap:anywhere; }
    .dashboard-page input, .dashboard-page select, .dashboard-page textarea {
      font:inherit; line-height:1.45;
    }
    .dashboard-page input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    .dashboard-page select, .dashboard-page textarea {
      display:block; width:100%; max-width:100%; min-height:42px;
    }
    .dashboard-page textarea {
      height:auto; min-height:112px; max-height:60vh; overflow:auto;
      resize:vertical; white-space:pre-wrap; overflow-wrap:anywhere;
    }
    .dashboard-page .dashboard-crud-form,
    .dashboard-page .dashboard-crud-field,
    .dashboard-page .dashboard-crud-card,
    .dashboard-page .dashboard-section-content { min-width:0; max-width:100%; }
    .dashboard-page .dashboard-crud-list {
      display:block; width:100%; max-width:100%; overflow-x:auto; overflow-y:hidden;
      overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;
    }
    .dashboard-page .dashboard-crud-table {
      width:100%; min-width:640px; max-width:none; table-layout:auto;
    }
    .dashboard-page .dashboard-crud-table th,
    .dashboard-page .dashboard-crud-table td {
      max-width:320px; white-space:normal; overflow-wrap:anywhere; word-break:break-word;
    }
    .dashboard-page :is(input, select, textarea, button, [tabindex]):focus-visible {
      scroll-margin-block:24px; scroll-margin-inline:16px;
    }
    @media(max-width:600px) {
      .dashboard-page { width:calc(100% - 24px); }
      .dashboard-page .dashboard-section-content { padding:14px; }
      .dashboard-page .dashboard-crud-card { padding:12px; }
      .dashboard-page .dashboard-crud-table { min-width:600px; }
    }

    footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #fafafa;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.035);
      color: #777777;
      font-size: 13px;
      letter-spacing: 0.2px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="current-page-label" id="current-page-label" aria-live="polite">Home</span>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="floating-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="floating-menu" id="floating-menu" aria-label="Main menu" hidden>
      <button class="menu-link" type="button" data-page="Home">Home</button>
      <button class="menu-link" type="button" data-page="Profile">Profile</button>
      <button class="menu-link" type="button" data-page="Login">Login</button>
      <button class="menu-link menu-dashboard" type="button" data-page="Dashboard" hidden>Dashboard</button>
    </nav>
  </header>

  <main id="main-content" aria-live="polite">
  </main>

  <footer>
    © 2026 Dalimgari. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yopfogoyjxwxplnabqii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGZvZ295anh3eHBsbmFicWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMyNjQsImV4cCI6MjEwNDg2OTI2NH0.dIVH8sp3qyD_AGmt1bNFVOpQKdrgcX734HkrEuOacB4"
    );

    const menuButton = document.querySelector(".menu-button");
    const floatingMenu = document.querySelector("#floating-menu");
    const mainContent = document.querySelector("#main-content");
    const menuLinks = document.querySelectorAll(".menu-link");

    // Site-wide: automatically scroll focused controls into view on every page.
    document.addEventListener("focusin", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement) ||
          !target.matches("input, select, textarea, button, a, [tabindex]")) return;
      requestAnimationFrame(() => {
        if (!target.isConnected) return;
        const rect = target.getBoundingClientRect();
        const viewportHeight = document.documentElement.clientHeight;
        const viewportWidth = document.documentElement.clientWidth;
        if (rect.top < 8 || rect.bottom > viewportHeight - 8 ||
            rect.left < 8 || rect.right > viewportWidth - 8) {
          target.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
        }
      });
    });

    let activeSession = null;

    function updateAuthMenu(session) {
      activeSession = session || null;
      const loginAction = document.querySelector('.menu-link[data-page="Login"], .menu-link[data-page="Logout"]');
      if (loginAction) {
        const signedIn = Boolean(activeSession);
        loginAction.dataset.page = signedIn ? "Logout" : "Login";
        loginAction.textContent = signedIn ? "Logout" : "Login";
        loginAction.setAttribute("aria-label", signedIn ? "Log out of your account" : "Log in to your account");
      }
      const dashboardAction = document.querySelector('.menu-link[data-page="Dashboard"]');
      const role = String((activeSession && activeSession.user && activeSession.user.app_metadata && activeSession.user.app_metadata.role) || "").toLowerCase();
      if (dashboardAction) dashboardAction.hidden = role !== "admin" || dashboardAction.getAttribute("aria-current") === "page";
    }

    async function renderHome() {
      // Home content starts below the header instead of being vertically centered.
      mainContent.style.alignItems = "flex-start";
      mainContent.style.justifyContent = "flex-start";

      const page = document.createElement("section");
      page.className = "home-page";
      page.setAttribute("aria-label", "Home page sections");
      page.style.cssText = "width:100%;max-width:1200px;min-height:1px;margin:0 auto;padding:0 16px 32px";

      const heroSection = document.createElement("section");
      heroSection.className = "home-section home-hero";
      heroSection.setAttribute("aria-label", "Hero");
      heroSection.style.cssText = "width:100%;min-width:0;max-width:100%;padding:24px 0 32px";

      const sectionNames = [
        ["Page Title", "home-page-title"],
        ["Widget", "home-widget"],
        ["Album", "home-album"],
        ["Page Card", "home-page-card"]
      ];
      const extraSections = sectionNames.map(([name, className]) => {
        const section = document.createElement("section");
        section.className = "home-section " + className;
        section.setAttribute("aria-label", name);
        section.style.cssText = "width:100%;min-width:0;max-width:100%;min-height:1px;padding:0 0 24px;box-sizing:border-box";
        return section;
      });

      page.append(heroSection, ...extraSections);
      mainContent.replaceChildren(page);

      const { data, error } = await supabaseClient.from("site_customizations")

    function sanitizePageHtml(html) {
      const parsed = new DOMParser().parseFromString(String(html || ""), "text/html");
      parsed.querySelectorAll("script,iframe,object,embed,base,meta,link,foreignObject").forEach(node => node.remove());
      parsed.querySelectorAll("*").forEach(node => {
        Array.from(node.attributes).forEach(attribute => {
          const name = attribute.name.toLowerCase();
          const value = String(attribute.value || "").trim().toLowerCase();
          if (name.startsWith("on") || name === "srcdoc" ||
              ((name === "href" || name === "src" || name === "xlink:href" || name === "action" || name === "formaction") &&
               (value.startsWith("javascript:") || value.startsWith("data:text/html:")))) {
            node.removeAttribute(attribute.name);
          }
        });
        if (node.tagName === "FORM") {
          node.removeAttribute("action");
          node.removeAttribute("method");
        }
      });
      return parsed.body;
    }

    async function renderHtmlInto(container, html, session, depth=0) {
      const safeBody = sanitizePageHtml(html);
      container.replaceChildren(...Array.from(safeBody.childNodes).map(node => document.importNode(node, true)));
      const includes = Array.from(container.querySelectorAll("[data-dalimgari-include]"));
      for (const slot of includes) {
        if (depth >= 5) { slot.textContent = "Page include depth limit reached."; continue; }
        const slug = generatePageSlug(slot.getAttribute("data-dalimgari-include"));
        if (!slug) { slot.remove(); continue; }
        const { data, error } = await supabaseClient.from("pages")
          .select("title,description,content,url,visibility").eq("url", slug).maybeSingle();
        if (error || !data) {
          slot.replaceChildren();
          slot.textContent = "Included page is unavailable.";
          continue;
        }
        await renderHtmlInto(slot, data.content || "", session, depth + 1);
      }
    }

    function generatePageSlug(value) {
      return String(value || "").trim().toLowerCase().replaceAll("/", "")
        .replace(/[^a-z0-9-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
    }

    async function renderStoredPage(rawSlug, session) {
      mainContent.style.alignItems = "flex-start";
      mainContent.style.justifyContent = "flex-start";
      mainContent.replaceChildren();
      const slug = generatePageSlug(rawSlug);
      const shell = document.createElement("article");
      shell.className = "stored-html-page";
      shell.style.cssText = "width:100%;max-width:1100px;box-sizing:border-box;margin:0 auto;padding:24px 16px 40px;overflow-wrap:anywhere";
      mainContent.append(shell);
      if (!slug) { shell.textContent = "Page not found."; return; }
      const { data, error } = await supabaseClient.from("pages")
        .select("title,description,content,url,visibility").eq("url", slug).maybeSingle();
      if (error || !data) {
        const message = document.createElement("p");
        message.textContent = "This page is unavailable or you do not have permission to view it.";
        shell.append(message);
        return;
      }
      const heading = document.createElement("h1");
      heading.textContent = data.title || "";
      heading.style.cssText = "margin:0 0 12px;overflow-wrap:anywhere";
      shell.append(heading);
      if (data.description) {
        const description = document.createElement("p");
        description.textContent = data.description;
        description.style.cssText = "margin:0 0 24px;line-height:1.6;overflow-wrap:anywhere";
        shell.append(description);
      }
      const content = document.createElement("div");
      content.className = "stored-html-page-content";
      shell.append(content);
      await renderHtmlInto(content, data.content || "", session);
      document.title = (data.title ? data.title + " | " : "") + "Dalimgari";
    }

    function renderPage(pageName) {
      mainContent.style.removeProperty("align-items");
      mainContent.style.removeProperty("justify-content");

      if (activeSession && (pageName === "Login" || pageName === "CreateAccount")) {
        pageName = "Profile";
        history.replaceState(null, "", "#profile");
      }
      mainContent.replaceChildren();

      if (pageName === "CreateAccount") { renderCreateAccount(); return; }
      if (pageName === "ForgotPassword") { renderForgotPassword(); return; }
      if (pageName === "Profile") { renderProfile(); return; }
      if (pageName === "EditProfile") { renderEditProfile(); return; }
      if (pageName === "Dashboard") { renderDashboard(); return; }
      if (pageName !== "Login") return;

      const form = document.createElement("form");
      form.className = "login-form";
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const submitButton = form.querySelector(".login-submit");
        const message = form.querySelector(".login-message");
        submitButton.disabled = true;
        submitButton.textContent = "Logging in...";
        message.textContent = "";
        message.removeAttribute("data-type");

        let loginResult;
        try {
          loginResult = await supabaseClient.auth.signInWithPassword({
            email: email.value.trim(),
            password: password.value
          });
        } catch (error) {
          loginResult = { error };
        }

        const { error } = loginResult;
        if (error) {
          const errorText = (error.message || "").toLowerCase();
          message.dataset.type = "error";
          if (errorText.includes("invalid login credentials")) {
            message.textContent = "Email or password is incorrect.";
          } else if (errorText.includes("email not confirmed")) {
            message.textContent = "Please confirm your email before logging in.";
          } else if (errorText.includes("rate limit") || errorText.includes("too many requests")) {
            message.textContent = "Too many attempts. Please wait a little and try again.";
          } else if (errorText.includes("fetch") || errorText.includes("network")) {
            message.textContent = "Connection problem. Check your internet and try again.";
          } else {
            message.textContent = "We couldn’t log you in. Please try again.";
          }
          submitButton.disabled = false;
          submitButton.textContent = "Login";
          return;
        }

        if (remember.checked) {
          localStorage.setItem("dalimgari-remember-email", "true");
          localStorage.setItem("dalimgari-saved-email", email.value.trim());
        } else {
          localStorage.removeItem("dalimgari-remember-email");
          localStorage.removeItem("dalimgari-saved-email");
        }

        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      });

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;
      if (localStorage.getItem("dalimgari-remember-email") === "true") {
        email.value = localStorage.getItem("dalimgari-saved-email") || "";
      }

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "password";
      password.placeholder = "Password";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "current-password";
      password.required = true;

      const rememberRow = document.createElement("div");
      rememberRow.className = "remember-row";

      const remember = document.createElement("input");
      remember.type = "checkbox";
      remember.id = "remember-password";
      remember.name = "remember-password";
      remember.checked = localStorage.getItem("dalimgari-remember-email") === "true";

      const rememberLabel = document.createElement("label");
      rememberLabel.htmlFor = "remember-password";
      rememberLabel.textContent = "Remember me";

      rememberRow.append(remember, rememberLabel);

      const forgot = document.createElement("a");
      forgot.className = "forgot-password";
      forgot.href = "#forgot-password";
      forgot.textContent = "Forgot password?";
      forgot.addEventListener("click", (event) => {
        event.preventDefault();
        history.pushState(null, "", "#forgot-password");
        renderPage("ForgotPassword");
        setCurrentMenuPage("ForgotPassword");
      });

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Login";

      const createAccount = document.createElement("a");
      createAccount.className = "create-account";
      createAccount.href = "#create-account";
      createAccount.textContent = "Create new account?";
      createAccount.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("CreateAccount");
        setCurrentMenuPage("CreateAccount");
        history.replaceState(null, "", "#create-account");
      });

      const message = document.createElement("p");

    function renderCreateAccount() {
      const form = document.createElement("form");
      form.className = "login-form";

      const heading = document.createElement("h1");
      heading.className = "login-title";
      heading.textContent = "Create New Account";

      const email = document.createElement("input");
      email.className = "login-field";
      email.type = "email";
      email.name = "signup-email";
      email.placeholder = "Email Address";
      email.setAttribute("aria-label", "Email Address");
      email.autocomplete = "email";
      email.required = true;

      const password = document.createElement("input");
      password.className = "login-field";
      password.type = "password";
      password.name = "signup-password";
      password.placeholder = "Password (at least 8 characters)";
      password.setAttribute("aria-label", "Password");
      password.autocomplete = "new-password";
      password.minLength = 8;
      password.required = true;

      const confirmPassword = document.createElement("input");
      confirmPassword.className = "login-field";
      confirmPassword.type = "password";
      confirmPassword.name = "confirm-password";
      confirmPassword.placeholder = "Confirm Password";
      confirmPassword.setAttribute("aria-label", "Confirm Password");
      confirmPassword.autocomplete = "new-password";
      confirmPassword.minLength = 8;
      confirmPassword.required = true;

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Create Account";

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "status");
      message.setAttribute("aria-live", "polite");

      const backToLogin = document.createElement("a");
      backToLogin.className = "create-account";
      backToLogin.href = "#login";
      backToLogin.textContent = "Already have an account? Login";
      backToLogin.addEventListener("click", (event) => {
        event.preventDefault();
        renderPage("Login");
        history.replaceState(null, "", "#login");
        setCurrentMenuPage("Login");
      });

      form.append(heading, email, password, confirmPassword, submit, message, backToLogin);
      mainContent.append(form);

      function setStatus(text, type) {
        message.dataset.type = type;
        message.replaceChildren(document.createTextNode(text));
      }

      function showExistingAccountMessage() {
        setStatus("This email may already be registered. Reset your password to continue.", "info");
        const resetLink = document.createElement("a");
        resetLink.className = "message-link";
        resetLink.href = "#forgot-password";
        resetLink.textContent = "Reset password";
        resetLink.addEventListener("click", (event) => {
          event.preventDefault();
          history.pushState(null, "", "#forgot-password");
          renderPage("ForgotPassword");
          setCurrentMenuPage("ForgotPassword");
        });
        message.append(resetLink);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("", "error");

        if (password.value.length < 8) {
          setStatus("Use at least 8 characters for your password.", "error");
          password.focus();
          return;
        }
        if (password.value !== confirmPassword.value) {
          setStatus("Passwords don’t match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Creating Account...";

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              emailRedirectTo: "https://dalimgari.github.io/dalimgari/#login"
            }
          });

          if (error) {
            const errorText = (error.message || "").toLowerCase();
            if (
              errorText.includes("already registered") ||
              errorText.includes("already exists") ||
              errorText.includes("user already")
            ) {
              showExistingAccountMessage();
            } else {
              const errorText = (error.message || "").toLowerCase();
              if (errorText.includes("rate limit") || errorText.includes("email rate limit")) {
                setStatus("Email limit reached. Please try again after one hour.", "error");
              } else if (errorText.includes("password")) {
                setStatus("Please choose a stronger valid password.", "error");
              } else if (errorText.includes("fetch") || errorText.includes("network")) {
                setStatus("Connection problem. Check your internet and try again.", "error");
              } else {
                setStatus("We couldn’t create your account. Please check your details and try again.", "error");
              }
            }
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          // Supabase can return an obfuscated user with no identities when
          // the submitted email already belongs to an account.
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
            showExistingAccountMessage();
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          if (data.session) {
            setStatus("Your account is ready.", "success");
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            return;
          }

          setStatus("Check your inbox to confirm your email.", "success");
          form.reset();
          submit.disabled = false;
          submit.textContent = "Create Account";
        } catch (error) {
          setStatus("Connection problem. Please try again.", "error");
          submit.disabled = false;
          submit.textContent = "Create Account";
        }
      });
    }




    function renderForgotPassword() {
      const card = document.createElement("section");
      card.className = "login-form recovery-form";
      card.setAttribute("aria-live", "polite");

      const heading = document.createElement("h1");
      heading.className = "login-title";
      heading.textContent = "Forgot password?";

      const description = document.createElement("p");
      description.className = "recovery-description";
      description.textContent = "Enter the email address linked to your account. If it is registered, a password-reset link will be sent.";

      const form = document.createElement("form");
      const emailLabel = document.createElement("label");
      emailLabel.htmlFor = "recovery-email";
      emailLabel.textContent = "Email Address";
      const email = document.createElement("input");
      email.className = "login-field";
      email.id = "recovery-email";
      email.type = "email";
      email.name = "email";
      email.placeholder = "Email Address";
      email.autocomplete = "email";
      email.required = true;

      const message = document.createElement("p");
      message.className = "login-message";
      message.setAttribute("role", "status");
      message.setAttribute("aria-live", "polite");

      const submit = document.createElement("button");
      submit.className = "login-submit";
      submit.type = "submit";
      submit.textContent = "Check Account";

      const back = document.createElement("a");
      back.className = "create-account";
      back.href = "#login";
      back.textContent = "Back to Login";
      back.addEventListener("click", (event) => {
        event.preventDefault();
        history.pushState(null, "", "#login");
        renderPage("Login");
        setCurrentMenuPage("Login");
      });

      form.append(emailLabel, email, submit);
      card.append(heading, description, form, message, back);
      mainContent.replaceChildren(card);

      const recoveryStorageKey = "dalimgari-password-recovery";
      const setStatus = (text, type) => {
        message.textContent = text;
        message.dataset.type = type;
      };

      const showResetForm = () => {
        heading.textContent = "Reset password";
        description.textContent = "Enter a new password for your account.";
        setCurrentMenuPage("ForgotPassword");
        form.replaceChildren();

        const passwordLabel = document.createElement("label");
        passwordLabel.htmlFor = "new-password";
        passwordLabel.textContent = "New Password";
        const password = document.createElement("input");
        password.className = "login-field";
        password.id = "new-password";
        password.type = "password";
        password.autocomplete = "new-password";
        password.placeholder = "New password (at least 8 characters)";
        password.minLength = 8;
        password.required = true;

        const confirmLabel = document.createElement("label");
        confirmLabel.htmlFor = "confirm-new-password";
        confirmLabel.textContent = "Confirm New Password";
        const confirmPassword = document.createElement("input");
        confirmPassword.className = "login-field";
        confirmPassword.id = "confirm-new-password";
        confirmPassword.type = "password";
        confirmPassword.autocomplete = "new-password";
        confirmPassword.placeholder = "Re-enter new password";
        confirmPassword.minLength = 8;
        confirmPassword.required = true;

        const save = document.createElement("button");
        save.className = "login-submit";
        save.type = "submit";
        save.textContent = "Save New Password";
        form.append(passwordLabel, password, confirmLabel, confirmPassword, save);
        message.textContent = "";
        message.removeAttribute("data-type");

        // The auth client has consumed the recovery credentials; keep only the app route.
        history.replaceState(null, "", window.location.pathname + "#forgot-password");
        form.onsubmit = async (event) => {
          event.preventDefault();
          if (password.value.length < 8) {
            setStatus("Use at least 8 characters for your password.", "error");
            return;
          }
          if (password.value !== confirmPassword.value) {
            setStatus("Passwords don’t match. Please try again.", "error");
            confirmPassword.focus();
            return;
          }
          save.disabled = true;
          save.textContent = "Saving...";
          const { error } = await supabaseClient.auth.updateUser({ password: password.value });
          if (error) {
            setStatus("We couldn’t update your password. Please try again.", "error");
            save.disabled = false;
            save.textContent = "Save New Password";
            return;
          }
          sessionStorage.removeItem(recoveryStorageKey);
          heading.textContent = "Password updated";
          description.textContent = "Your password has been changed successfully. You can now return to the login page.";
          form.replaceChildren();
          message.textContent = "";
          back.textContent = "Return to Login";
          setCurrentMenuPage("ForgotPassword");
        };
      };

      form.addEventListener("submit", async (event) => {
        if (form.dataset.resetMode === "true") return;
        event.preventDefault();
        if (!email.checkValidity()) { email.reportValidity(); return; }
        submit.disabled = true;
        submit.textContent = "Checking...";
        message.textContent = "";
        // Keep the existing redirect URI, which may already be allow-listed in Supabase.
        const redirectTarget = new URL("forgot-password.html", window.location.href);
        redirectTarget.hash = "";
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: redirectTarget.href });
        if (error) setStatus("Couldn’t send the reset email. Please wait a little and try again.", "error");
        else setStatus("If this email is registered, a reset link will arrive shortly. Check your inbox and spam folder.", "success");
        submit.disabled = false;
        submit.textContent = "Check Account";
      });

      const originalShowResetForm = showResetForm;
      // Mark the form so the submit listener does not treat password updates as email requests.
      const safeShowResetForm = () => {
        form.dataset.resetMode = "true";
        originalShowResetForm();
      };
      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY" && routeIsForgotPassword()) safeShowResetForm();
      });

      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const hasSavedRecoveryState = sessionStorage.getItem(recoveryStorageKey) === "true";
      const isRecoveryLink = params.has("code") ||
        (hashParams.get("type") === "recovery" && hashParams.has("access_token")) ||
        hasSavedRecoveryState;
      (async () => {
        const { data: currentSession } = await supabaseClient.auth.getSession();
        if (params.has("code")) {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(params.get("code"));
          if (error) {
            sessionStorage.removeItem(recoveryStorageKey);
            setStatus("This reset link has expired. Request a new one.", "error");
            return;
          }
          sessionStorage.setItem(recoveryStorageKey, "true");
          history.replaceState(null, "", window.location.pathname + "#forgot-password");
          safeShowResetForm();
        } else if (hashParams.get("type") === "recovery" && hashParams.has("access_token")) {
          sessionStorage.setItem(recoveryStorageKey, "true");
          safeShowResetForm();
        } else if (hasSavedRecoveryState && currentSession.session) {
          safeShowResetForm();
        } else if (params.has("error") || hashParams.has("error")) {
          sessionStorage.removeItem(recoveryStorageKey);
          setStatus("This password-reset link is invalid or has expired. Request a new reset email.", "error");
        } else if (currentSession.session && !isRecoveryLink) {
          // A signed-in user can still request a reset link, so keep this route open.
        }
      })();
    }

    function routeIsForgotPassword() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      return window.location.hash.toLowerCase() === "#forgot-password" ||
        params.has("code") ||
        (hashParams.get("type") === "recovery" && hashParams.has("access_token")) ||
        sessionStorage.getItem("dalimgari-password-recovery") === "true";
    }

    function setCurrentMenuPage(pageName) {
      const currentPageLabel = document.querySelector("#current-page-label");
      const displayName = pageName === "Profile" && window.location.hash.toLowerCase() === "#edit-profile"
        ? "Edit Profile"
        : pageName === "CreateAccount"
          ? "Create Account"
          : pageName === "ForgotPassword"
            ? "Forgot Password"
            : pageName;
      if (currentPageLabel) currentPageLabel.textContent = displayName;
      const role = String((activeSession && activeSession.user && activeSession.user.app_metadata && activeSession.user.app_metadata.role) || "").toLowerCase();
      menuLinks.forEach((item) => {
        const isCurrentPage = item.dataset.page === pageName;
        if (isCurrentPage) item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
        item.hidden = isCurrentPage || (item.dataset.page === "Dashboard" && role !== "admin");
      });
    }
    async function getCurrentUser() {
      try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error) throw error;
        return data.user || null;
      } catch (error) {
        console.error("Could not load the current user:", error);
        return null;
      }

    async function resolveAvatarUrl(user) {
      const avatarUrl = metadataValue(user, "avatar_url");
      if (!avatarUrl.startsWith("data:image/")) return avatarUrl;
      try {
        const response = await fetch(avatarUrl);
        if (!response.ok) throw new Error("Could not read the existing profile picture.");
        const imageBlob = await response.blob();
        const filePath = user.id + "/avatar.jpg";
        const { error: uploadError } = await supabaseClient.storage
          .from("profile-pictures")
          .upload(filePath, imageBlob, { contentType: "image/jpeg", upsert: true, cacheControl: "0" });
        if (uploadError) throw uploadError;
        const { data } = supabaseClient.storage.from("profile-pictures").getPublicUrl(filePath);
        const publicUrl = data.publicUrl + "?v=" + Date.now();
        const { error: metadataError } = await supabaseClient.auth.updateUser({ data: { avatar_url: publicUrl } });
        if (metadataError) throw metadataError;
        return publicUrl;
      } catch (error) {
        console.error("Could not move the existing profile picture to Storage:", error);
        return avatarUrl;
      }
    }

      if (error) {
        console.error("Could not load the user record from the profiles table:", error);
        return { id: user.id, full_name: "", phone: "", date_of_birth: null, bio: "" };
      }
      return data || { id: user.id, full_name: "", phone: "", date_of_birth: null, bio: "" };
    }

          } else if (currentRoute === "#dashboard" || currentRoute.startsWith("#dashboard-")) {
            if (session) { renderPage("Dashboard"); setCurrentMenuPage("Dashboard"); }
            else { renderPage("Login"); history.replaceState(null, "", "#login"); setCurrentMenuPage("Login"); }
          } else if (currentRoute === "#create-account" && !session) {
            renderPage("CreateAccount"); setCurrentMenuPage("CreateAccount");
          } else if (currentRoute === "#login" && session) {
            renderPage("Profile"); history.replaceState(null, "", "#profile"); setCurrentMenuPage("Profile");
          } else if (currentRoute === "#edit-profile" && session) {
            renderPage("EditProfile"); setCurrentMenuPage("Profile");
          } else if (currentRoute === "#login") {
            renderPage("Login"); setCurrentMenuPage("Login");
          } else if (currentRoute === "#create-account") {
            renderPage("Login"); history.replaceState(null, "", "#login"); setCurrentMenuPage("Login");
          } else if (currentRoute === "#profile") {
            renderPage("Profile"); setCurrentMenuPage("Profile");
          } else {
            mainContent.replaceChildren(); history.replaceState(null, "", "#home"); setCurrentMenuPage("Home");
          }
        }
      } catch (error) {
        console.error("Could not restore the current route:", error);
      }
    };
    window.addEventListener("hashchange", refreshCurrentRoute);
    window.addEventListener("popstate", refreshCurrentRoute);

    menuLinks.forEach((link) => {
      link.addEventListener("click", async () => {
        const pageName = link.dataset.page;
        try {
          // Home is always directly reachable, regardless of authentication state.
          if (pageName === "Home") {
            renderHome();
            history.replaceState(null, "", "#home");
            setCurrentMenuPage("Home");
          } else if (pageName === "Logout") {
            link.disabled = true;
            link.textContent = "Logging out...";
            const { error } = await supabaseClient.auth.signOut();
            if (error) throw error;
            updateAuthMenu(null);
            renderPage("Login");
            history.replaceState(null, "", "#login");
            setCurrentMenuPage("Login");
          } else {
            let session = null;
            try {
              const { data, error } = await supabaseClient.auth.getSession();
              if (error) throw error;
              session = data.session;
            } catch (sessionError) {
              console.error("Could not check the session during navigation:", sessionError);
            }
            updateAuthMenu(session);
            const role = String((session && session.user && session.user.app_metadata && session.user.app_metadata.role) || "").toLowerCase();
            if (pageName === "Dashboard" && (!session || role !== "admin")) {
              renderPage(session ? "Profile" : "Login");
              const safePage = session ? "Profile" : "Login";
              history.replaceState(null, "", "#" + safePage.toLowerCase());
              setCurrentMenuPage(safePage);
            } else if (session && (pageName === "Login" || pageName === "CreateAccount")) {
              renderPage("Profile");
              history.replaceState(null, "", "#profile");
              setCurrentMenuPage("Profile");
            } else {
              renderPage(pageName);
              history.replaceState(null, "", pageName === "Home" ? "#home" : "#" + pageName.toLowerCase());
              setCurrentMenuPage(pageName);
            }
          }
        } catch (error) {
          console.error("Menu navigation failed:", error);
          updateAuthMenu(null);
          renderPage("Login");
          history.replaceState(null, "", "#login");
          setCurrentMenuPage("Login");
        } finally {
          link.disabled = false;
          floatingMenu.hidden = true;
          menuButton.setAttribute("aria-expanded", "false");
          menuButton.setAttribute("aria-label", "Open menu");
          if (pageName === "Logout") link.textContent = "Login";
        }
      });
    });
  </script>

  <script>
    // Keep menu toggling and navigation functional even if the main app script fails.
    (() => {
      const menuButton = document.querySelector(".menu-button");
      const floatingMenu = document.querySelector("#floating-menu");
      if (!menuButton || !floatingMenu) return;

      const closeMenu = () => {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      };

      menuButton.addEventListener("click", () => {
        const isOpening = floatingMenu.hidden;
        floatingMenu.hidden = !isOpening;
        menuButton.setAttribute("aria-expanded", String(isOpening));
        menuButton.setAttribute("aria-label", isOpening ? "Close menu" : "Open menu");
      });

      document.addEventListener("click", (event) => {
        if (!menuButton.contains(event.target) && !floatingMenu.contains(event.target)) closeMenu();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMenu();
      });

    })();
  </script>
</body>
</html>
