<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="global-stylesheet.css">
</head>
<body>
  <header data-layout="header">
    <div class="header-bar">
      <button type="button" data-menu-toggle aria-label="Toggle menu" aria-expanded="false">☰</button>
      <div class="header-title">Home</div>
      <a class="header-avatar" href="profile.html" aria-label="Profile">👤</a>
    </div>
  </header>

  <main data-layout="content">
    <div class="content-panel">Welcome to Dalimgari</div>
  </main>

  <aside data-layout="sidebar" class="sidebar">
    <div class="sidebar-panel">
      <div>Sidebar</div>
    </div>
  </aside>

  <script>
    const menuButton = document.querySelector("[data-menu-toggle]");
    const sidebar = document.querySelector("[data-layout='sidebar']");

    menuButton?.addEventListener("click", () => {
      const open = sidebar.classList.toggle("is-open");
      menuButton.setAttribute("aria-expanded", String(open));
    });
  </script>
</body>
</html>
