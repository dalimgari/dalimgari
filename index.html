<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      margin: 0;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: sticky;
      top: 12px;
      z-index: 10;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.16);
    }

    .current-page-label {
      min-width: 0;
      margin: 0 auto 0 0;
      padding-right: 16px;
      color: #222222;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .login-title,
    .profile-heading,
    .dashboard-heading {
      display: none;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button:hover,
    .menu-button:focus-visible {
      background-color: #f5f5f5;
      outline: none;
    }

    .menu-button span {
      display: block;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background-color: #333333;
    }

    .floating-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(260px, calc(100vw - 32px));
      padding: 8px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background-color: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }

    .floating-menu[hidden] {
      display: none;
    }

    .menu-link[hidden] {
      display: none;
    }

    .menu-link {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #333333;
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .menu-link:hover,
    .menu-link:focus-visible,
    .menu-link[aria-current="page"] {
      background-color: #f3f4f6;
      color: #111827;
      outline: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    .login-form {
      width: min(100% - 32px, 400px);
      padding: 28px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .login-title {
      margin: 0 0 20px;
      color: #222222;
      font-size: 24px;
      line-height: 1.3;
    }

    .login-field {
      display: block;
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid #dcdcdc;
      border-radius: 9px;
      background: #ffffff;
      color: #222222;
      font: inherit;
      font-size: 15px;
    }

    .login-field:focus {
      border-color: #777777;
      outline: 2px solid rgba(0, 0, 0, 0.06);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #444444;
      font-size: 14px;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #222222;
      cursor: pointer;
    }

    .remember-row label {
      cursor: pointer;
    }

    .forgot-password {
      display: block;
      margin: 2px 0 20px;
      color: #333333;
      font-size: 14px;
      text-align: right;
      text-decoration: none;
    }

    .forgot-password:hover,
    .create-account:hover {
      text-decoration: underline;
    }

    .login-submit {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #444444;
    }

    .login-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 14px 0 0;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-message:empty {
      display: none;
    }

    .login-message::before {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .login-message[data-type="error"] {
      color: #a12622;
      background: #fff4f2;
      border-color: #f6d5d1;
    }

    .login-message[data-type="error"]::before { content: "×"; }

    .login-message[data-type="success"] {
      color: #176b43;
      background: #effaf3;
      border-color: #ccebd7;
    }

    .login-message[data-type="success"]::before { content: "✓"; }

    .login-message[data-type="info"] {
      color: #245b8f;
      background: #f1f7ff;
      border-color: #d7e8fb;
    }

    .login-message[data-type="info"]::before { content: "i"; }

    .create-account {
      display: block;
      margin-top: 20px;
      color: #333333;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }


    .profile-page{width:min(100% - 32px,760px);margin:28px auto;padding:24px;border:1px solid #eee;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    .profile-heading{margin:0 0 20px;color:#222;font-size:24px}
    .profile-summary{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:#f8f9fb;margin-bottom:20px}
    .profile-avatar{width:64px;height:64px;flex:0 0 64px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#e5e7eb;color:#374151;font-size:24px;font-weight:700}.profile-avatar img{width:100%;height:100%;object-fit:cover}.avatar-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.avatar-upload{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .profile-name{margin:0 0 5px;font-size:20px;overflow-wrap:anywhere}.profile-email{margin:0;color:#666;font-size:14px;overflow-wrap:anywhere}
    .role-badge{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#e8eefc;color:#244a8f;font-size:10px;vertical-align:middle;letter-spacing:.4px}
    .profile-section{padding:18px;margin-bottom:16px;border:1px solid #eee;border-radius:12px}.profile-section h2{margin:0 0 14px;font-size:17px}
    .profile-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.detail-label{margin:0 0 5px;color:#777;font-size:12px}.detail-value{margin:0;color:#222;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
    .profile-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:18px}.action-button{min-height:44px;padding:0 16px;border:1px solid #ddd;border-radius:9px;background:#fff;color:#222;font:inherit;font-weight:600;cursor:pointer}.action-button.primary{background:#222;border-color:#222;color:#fff}
    .profile-input{width:100%;margin:0 0 15px;padding:12px 13px;border:1px solid #dcdcdc;border-radius:9px;background:#fff;color:#222;font:inherit;font-size:15px}
    .profile-picture-editor{margin-bottom:20px;background:linear-gradient(135deg,#fbfdff,#f7f9fc)}
    .profile-picture-editor h2{margin-bottom:16px}
    .profile-picture-editor-row{display:flex;align-items:center;gap:20px}
    .profile-avatar-large{width:104px;height:104px;flex:0 0 104px;font-size:36px;border:3px solid #fff;box-shadow:0 3px 14px rgba(15,23,42,.12)}
    .profile-picture-upload-area{min-width:0;flex:1}
    .attachment-picker.profile-picture-picker{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;column-gap:10px;row-gap:8px;margin:0 0 12px;padding:12px}

    .attachment-picker.profile-picture-picker .attachment-title{overflow-wrap:anywhere}
    .attachment-picker.profile-picture-picker .attachment-button{grid-column:2;grid-row:2;justify-self:start;white-space:nowrap}
    .profile-picture-picker.is-uploading{opacity:.75;cursor:wait}
    .profile-picture-picker .avatar-upload{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .profile-picture-progress{margin:0 0 10px}
    .profile-picture-progress[hidden]{display:none}
    .profile-picture-progress.is-active .attachment-progress-fill{width:35%;animation:profile-picture-progress 1.2s ease-in-out infinite alternate}
    @keyframes profile-picture-progress{from{transform:translateX(-15%)}to{transform:translateX(140%)}}
    @media(max-width:480px){.profile-picture-editor-row{align-items:flex-start;flex-direction:column;gap:14px}.profile-picture-upload-area{width:100%}.profile-avatar-large{width:88px;height:88px;flex-basis:88px}}
    .edit-profile-form label{display:block;margin:0 0 6px;color:#444;font-size:14px}.profile-status{margin:12px 0;font-size:14px;line-height:1.5}.back-profile{margin-bottom:18px}.attachment-note{margin:-6px 0 15px;color:#777;font-size:13px}
    .attachment-picker{display:flex;align-items:center;gap:14px;margin:4px 0 18px;padding:16px;border:1px dashed #bfc5ce;border-radius:12px;background:#f8fafc;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
    .attachment-picker:hover,.attachment-picker:focus-within{border-color:#64748b;background:#f1f5f9}
    .attachment-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:#e9eef5;color:#334155;font-size:23px}
    .attachment-copy{min-width:0;flex:1}.attachment-title{display:block;margin:0 0 4px;color:#222;font-size:14px;font-weight:600}.attachment-subtitle{display:block;color:#6b7280;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    .attachment-button{flex:0 0 auto;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#222;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .attachment-button:hover{background:#f3f4f6}.attachment-filename{margin:-8px 0 14px;color:#475569;font-size:13px;overflow-wrap:anywhere}
    .attachment-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:560px){.profile-page{padding:17px;margin:18px auto}.profile-details{grid-template-columns:1fr}.profile-actions .action-button{flex:1 1 100%}.profile-heading{font-size:22px}}

    .dashboard-page {
      display: block;
      align-self: flex-start;
      width: calc(100% - 32px);
      max-width: 1200px;
      margin: 28px auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .dashboard-heading {
      margin: 0 0 18px;
      color: #222222;
      font-size: 26px;
      line-height: 1.3;
    }

    .dashboard-navigation-area {
      width: 100%;
      margin: 0 0 22px;
      padding: 12px 0 16px;

    }

    .dashboard-navigation {
      display: flex;

      overflow-y: hidden;

      scrollbar-width: thin;
      scrollbar-color: #c7c7c7 #f5f5f5;
    }

    .dashboard-nav-button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #dedede;
      border-radius: 999px;
      background: #ffffff;
      color: #333333;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .dashboard-nav-button:hover,
    .dashboard-nav-button:focus-visible {
      border-color: #999999;
      outline: none;
    }

    .dashboard-nav-button[aria-selected="true"] {
      border-color: #222222;
      background: #222222;
      color: #ffffff;
    }

    .dashboard-section-content {
      min-height: 220px;
      padding: 22px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    .dashboard-section-title {
      margin: 0 0 10px;
      color: #222222;
      font-size: 21px;
      line-height: 1.35;
    }

    .dashboard-section-description {
      margin: 0;
      color: #666666;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .dashboard-page {
        width: calc(100% - 24px);
        margin: 20px auto;
      }

      .dashboard-navigation-area {
        margin-bottom: 16px;
        padding-top: 8px;
      }

      .dashboard-navigation {
        gap: 8px;
      }

      .dashboard-nav-button {
        min-height: 40px;
        padding: 0 14px;
        font-size: 13px;
      }

      .dashboard-section-content {
        min-height: 180px;
        padding: 17px;
      }
    }


    .dashboard-crud { display:grid; gap:22px; }
    .dashboard-crud-card { padding:18px; border:1px solid #e5e7eb; border-radius:12px; background:#fff; }
    .dashboard-crud-card h3 { margin:0 0 16px; font-size:17px; color:#222; }
    .dashboard-crud-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .dashboard-crud-field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .dashboard-crud-field.full { grid-column:1/-1; }
    .dashboard-crud-field label { color:#444; font-size:13px; font-weight:600; }
    .dashboard-crud-input { width:100%; min-height:42px; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#222; font:inherit; font-size:14px; }
    .dashboard-crud-input:focus { outline:2px solid #dbeafe; border-color:#64748b; }
    .dashboard-crud-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; }
    .dashboard-crud-status { min-height:20px; margin:12px 0 0; font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
    .dashboard-crud-list { width:100%; overflow-x:auto; }
    .dashboard-crud-table { width:100%; border-collapse:collapse; font-size:13px; }
    .dashboard-crud-table th,.dashboard-crud-table td { padding:11px 10px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
    .dashboard-crud-table th { color:#555; background:#f8fafc; white-space:nowrap; }
    .dashboard-crud-row { cursor:pointer; }
    .dashboard-crud-row:hover,.dashboard-crud-row.is-selected { background:#f1f5f9; }
    .dashboard-crud-row:focus { outline:2px solid #94a3b8; outline-offset:-2px; }
    .dashboard-crud-empty { padding:20px 10px; color:#777; text-align:center; }
    .dashboard-crud-hint { margin:0 0 14px; color:#666; font-size:13px; line-height:1.5; }
    @media(max-width:600px) { .dashboard-crud-form { grid-template-columns:1fr; } .dashboard-crud-field.full { grid-column:auto; } .dashboard-crud-card { padding:14px; } }

    footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #fafafa;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.035);
      color: #777777;
      font-size: 13px;
      letter-spacing: 0.2px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="current-page-label" id="current-page-label" aria-live="polite">Home</span>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="floating-menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="floating-menu" id="floating-menu" aria-label="Main menu" hidden>
      <button class="menu-link" type="button" data-page="Home">Home</button>
      <button class="menu-link" type="button" data-page="Profile">Profile</button>
      <button class="menu-link" type="button" data-page="Login">Login</button>
    </nav>
  </header>

  <main id="main-content" aria-live="polite">
  </main>

  <footer>
    © 2026 Dalimgari. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yopfogoyjxwxplnabqii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGZvZ295anh3eHBsbmFicWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMyNjQsImV4cCI6MjEwNDg2OTI2NH0.dIVH8sp3qyD_AGmt1bNFVOpQKdrgcX734HkrEuOacB4"
    );

    const menuButton = document.querySelector(".menu-button");
    const floatingMenu = document.querySelector("#floating-menu");
    const mainContent = document.querySelector("#main-content");
    const menuLinks = document.querySelectorAll(".menu-link");

    let activeSession = null;

    function updateAuthMenu(session) {
      activeSession = session || null;
      const loginAction = document.querySelector('.menu-link[data-page="Login"], .menu-link[data-page="Logout"]');
      if (loginAction) {
        const signedIn = Boolean(activeSession);
        loginAction.dataset.page = signedIn ? "Logout" : "Login";
        loginAction.textContent = signedIn ? "Logout" : "Login";
        loginAction.setAttribute("aria-label", signedIn ? "Log out of your account" : "Log in to your account");
      }
    }

    async function renderHome() {
      const page=document.createElement("section");
      page.className="home-page";
      page.style.cssText="max-width:1000px;margin:0 auto;padding:28px 18px 40px";
      const heading=document.createElement("h1");
      heading.textContent="Welcome to Dalimgari";
      heading.style.cssText="font-size:clamp(28px,5vw,42px);margin:0 0 10px";
      const intro=document.createElement("p");
      intro.textContent="Explore public posts and albums.";
      intro.style.cssText="color:#666;line-height:1.6;margin:0 0 28px";
      page.append(heading,intro);
      const postsHeading=document.createElement("h2");postsHeading.textContent="Latest Posts";
      postsHeading.style.cssText="font-size:22px;margin:24px 0 12px";
      const postsList=document.createElement("div");postsList.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px";
      page.append(postsHeading,postsList);
      const albumsHeading=document.createElement("h2");albumsHeading.textContent="Albums";
      albumsHeading.style.cssText="font-size:22px;margin:30px 0 12px";
      const albumsList=document.createElement("div");albumsList.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px";
      page.append(albumsHeading,albumsList);
      mainContent.replaceChildren(page);
      const cardStyle="border:1px solid #e7e7e7;border-radius:12px;padding:16px;background:#fff;min-width:0";
      const [postsResult,albumsResult]=await Promise.all([
        supabaseClient.from("post").select("id,title,caption,description,media_url,storage_path,external_url,media_type,created_at").eq("visibility","public").order("created_at",{ascending:false}).limit(12),
        supabaseClient.from("albums").select("id,title,description,url,created_at").eq("visibility","public").order("created_at",{ascending:false}).limit(12)
      ]);
      if(!postsResult.error && postsResult.data && postsResult.data.length){
        for (const post of postsResult.data) {
          const card=document.createElement("article");card.style.cssText=cardStyle;
          const title=document.createElement("h3");title.textContent=post.caption||post.title||"Post";title.style.cssText="font-size:18px;margin:0 0 8px";
          card.append(title);
          const description=document.createElement("p");description.textContent=post.description||"";description.style.cssText="color:#666;line-height:1.5;margin:0";
          if(description.textContent)card.append(description);
          let mediaUrl=String(post.external_url||post.media_url||"");
          if(post.storage_path||mediaUrl.startsWith("posts/")){
            const {data:signedMedia,error:signError}=await supabaseClient.functions.invoke("public-post-media",{body:{post_id:post.id}});
            mediaUrl=!signError&&signedMedia&&signedMedia.url?signedMedia.url:"";
          }
          if(/^https?:\/\//i.test(mediaUrl)){
            const cleanUrl=mediaUrl.split("?")[0];
            if((post.media_type==="video")||/\.(mp4|webm|mov|m4v|ogv)$/i.test(cleanUrl)){
              const video=document.createElement("video");video.src=mediaUrl;video.controls=true;video.playsInline=true;video.preload="metadata";video.style.cssText="display:block;width:100%;max-height:240px;object-fit:contain;margin:0 0 12px;border-radius:8px";card.insertBefore(video,title);
            }else if((post.media_type==="photo")||/\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(cleanUrl)){
              const image=document.createElement("img");image.src=mediaUrl;image.alt=title.textContent;image.loading="lazy";image.style.cssText="display:block;width:100%;max-height:240px;object-fit:cover;margin:0 0 12px;border-radius:8px";card.insertBefore(image,title);
            }
          }

      });

      form.append(heading, email, password, confirmPassword, submit, message, backToLogin);

      function showExistingAccountMessage() {
        setStatus("This email may already be registered. Reset your password to continue.", "info");
        const resetLink = document.createElement("a");
        resetLink.className = "message-link";
        resetLink.href = "#forgot-password";
        resetLink.textContent = "Reset password";
        resetLink.addEventListener("click", (event) => {
          event.preventDefault();
          history.pushState(null, "", "#forgot-password");
          renderPage("ForgotPassword");
          setCurrentMenuPage("ForgotPassword");
        });
        message.append(resetLink);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("", "error");

        if (password.value.length < 8) {
          setStatus("Use at least 8 characters for your password.", "error");
          password.focus();
          return;
        }
        if (password.value !== confirmPassword.value) {
          setStatus("Passwords don’t match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Creating Account...";

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email.value.trim(),
            password: password.value,
            options: {
              emailRedirectTo: "https://dalimgari.github.io/dalimgari/#login"
            }
          });

          if (error) {
            const errorText = (error.message || "").toLowerCase();
            if (
              errorText.includes("already registered") ||
              errorText.includes("already exists") ||
              errorText.includes("user already")
            ) {
              showExistingAccountMessage();
            } else {
              const errorText = (error.message || "").toLowerCase();
              if (errorText.includes("rate limit") || errorText.includes("email rate limit")) {
                setStatus("Email limit reached. Please try again after one hour.", "error");
              } else if (errorText.includes("password")) {
                setStatus("Please choose a stronger valid password.", "error");
              } else if (errorText.includes("fetch") || errorText.includes("network")) {
                setStatus("Connection problem. Check your internet and try again.", "error");
              } else {
                setStatus("We couldn’t create your account. Please check your details and try again.", "error");
              }
            }
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          // Supabase can return an obfuscated user with no identities when
          // the submitted email already belongs to an account.
          if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
            showExistingAccountMessage();
            submit.disabled = false;
            submit.textContent = "Create Account";
            return;
          }

          if (data.session) {
            setStatus("Your account is ready.", "success");
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            return;
          }

          setStatus("Check your inbox to confirm your email.", "success");
          form.reset();
          submit.disabled = false;
          submit.textContent = "Create Account";
        } catch (error) {
          setStatus("Connection problem. Please try again.", "error");
          submit.disabled = false;
          submit.textContent = "Create Account";
        }
      });
    }

        heading.textContent = "Reset password";

        form.replaceChildren();

        const passwordLabel = document.createElement("label");

        password.minLength = 8;

        confirmLabel.htmlFor = "confirm-new-password";

        form.append(passwordLabel, password, confirmLabel, confirmPassword, save);
        message.textContent = "";
        message.removeAttribute("data-type");

        // The auth client has consumed the recovery credentials; keep only the app route.
        history.replaceState(null, "", window.location.pathname + "#forgot-password");
        form.onsubmit = async (event) => {
          event.preventDefault();
          if (password.value.length < 8) {
            setStatus("Use at least 8 characters for your password.", "error");
            return;
          }
          if (password.value !== confirmPassword.value) {
            setStatus("Passwords don’t match. Please try again.", "error");
            confirmPassword.focus();
            return;
          }
          save.disabled = true;
          save.textContent = "Saving...";
          const { error } = await supabaseClient.auth.updateUser({ password: password.value });
          if (error) {
            setStatus("We couldn’t update your password. Please try again.", "error");

        submit.textContent = "Checking...";
        message.textContent = "";
        // Keep the existing redirect URI, which may already be allow-listed in Supabase.
        const redirectTarget = new URL("forgot-password.html", window.location.href);
        redirectTarget.hash = "";

      });

      const originalShowResetForm = showResetForm;
      // Mark the form so the submit listener does not treat password updates as email requests.
      const safeShowResetForm = () => {
        form.dataset.resetMode = "true";
        originalShowResetForm();
      };
      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY" && routeIsForgotPassword()) safeShowResetForm();
      });

      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const hasSavedRecoveryState = sessionStorage.getItem(recoveryStorageKey) === "true";
      const isRecoveryLink = params.has("code") ||
        (hashParams.get("type") === "recovery" && hashParams.has("access_token")) ||
        hasSavedRecoveryState;
      (async () => {
        const { data: currentSession } = await supabaseClient.auth.getSession();
        if (params.has("code")) {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(params.get("code"));
          if (error) {
            sessionStorage.removeItem(recoveryStorageKey);
            setStatus("This reset link has expired. Request a new one.", "error");
            return;
          }
          sessionStorage.setItem(recoveryStorageKey, "true");
          history.replaceState(null, "", window.location.pathname + "#forgot-password");
          safeShowResetForm();
        } else if (hashParams.get("type") === "recovery" && hashParams.has("access_token")) {
          sessionStorage.setItem(recoveryStorageKey, "true");
          safeShowResetForm();
        } else if (hasSavedRecoveryState && currentSession.session) {
          safeShowResetForm();
        } else if (params.has("error") || hashParams.has("error")) {
          sessionStorage.removeItem(recoveryStorageKey);
          setStatus("This password-reset link is invalid or has expired. Request a new reset email.", "error");
        } else if (currentSession.session && !isRecoveryLink) {
          // A signed-in user can still request a reset link, so keep this route open.
        }
      })();
    }

    function metadataValue(user, key) { return (user.user_metadata && user.user_metadata[key]) || ""; }

    async function loadUserProfile(user) {
      const { data, error } = await supabaseClient.from("profiles")
        .select("id,full_name,phone,date_of_birth,bio,avatar_url")
        .eq("id", user.id).maybeSingle();
      if (error) {

      }

    function profileImageExtension(mimeType) {
      const extensions = {
        "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp",
        "image/gif": "gif", "image/avif": "avif", "image/bmp": "bmp"
      };
      return extensions[String(mimeType || "").toLowerCase()] || "";
    }

    async function uploadProfileImageFile(user, file) {
      const extension = profileImageExtension(file.type);
      if (!extension) throw new Error("Use a JPG, JPEG, PNG, WebP, GIF, AVIF, or BMP image.");
      const path = user.id + "/profile." + extension;
      const { error: uploadError } = await supabaseClient.storage.from("site-media").upload(path, file, {
        contentType: file.type, upsert: true, cacheControl: "3600"
      });
      if (uploadError) throw uploadError;
      const { error: profileError } = await supabaseClient.from("profiles").update({ avatar_url: path, updated_at: new Date().toISOString() }).eq("id", user.id);
      if (profileError) throw profileError;
      const { error: metadataCleanupError } = await supabaseClient.auth.updateUser({ data: { avatar_url: null } });
      if (metadataCleanupError) console.warn("Profile image saved, but legacy Auth metadata cleanup failed:", metadataCleanupError);
      return getProfileImageSignedUrl(path);
    }

    async function getProfileImageSignedUrl(path) {
      const { data, error } = await supabaseClient.storage.from("site-media").createSignedUrl(path, 3600);
      if (error) throw error;
      return data.signedUrl;
    }

    async function resolveProfileAvatarUrl(user, profile = null) {
      const legacyAvatar = metadataValue(user, "avatar_url");
      const raw = (profile && profile.avatar_url) || (legacyAvatar.startsWith("data:image/") ? legacyAvatar : "");
      if (!raw) return "";
      if (raw.startsWith("data:image/")) {
        try {
          const match = /^data:(image\/[a-zA-Z0-9.+-]+);base64,([\s\S]+)$/.exec(raw);
          if (!match) throw new Error("Unsupported legacy image data.");
          const extension = profileImageExtension(match[1]);
          if (!extension) throw new Error("Unsupported legacy image format.");
          const binary = atob(match[2]);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const file = new File([bytes], "profile." + extension, { type: match[1] });
          return await uploadProfileImageFile(user, file);
        } catch (error) {
          console.error("Could not migrate the existing profile image; original image data is retained:", error);
          return raw;
        }
      }
      if (raw.startsWith(user.id + "/")) {
        try { return await getProfileImageSignedUrl(raw); }
        catch (error) { console.error("Could not create profile image URL:", error); return ""; }
      }
      return raw;
    }

    function formatProfileImageSize(bytes) {
      if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

      const picturePicker = document.createElement("label"); picturePicker.className = "attachment-picker profile-picture-picker";
      const pictureIcon = document.createElement("span"); pictureIcon.className = "attachment-icon"; pictureIcon.setAttribute("aria-hidden", "true"); pictureIcon.textContent = "↑";
      const pictureCopy = document.createElement("span"); pictureCopy.className = "attachment-copy";
      const pictureTitle = document.createElement("span"); pictureTitle.className = "attachment-title"; pictureTitle.textContent = "Change profile picture";
      pictureCopy.append(pictureTitle);
      const pictureButton = document.createElement("span"); pictureButton.className = "attachment-button"; pictureButton.textContent = "Choose image";
      picturePicker.append(pictureIcon, pictureCopy, pictureButton);
      const pictureFileName = document.createElement("p"); pictureFileName.className = "attachment-filename"; pictureFileName.hidden = true;
      const pictureProgress = document.createElement("div"); pictureProgress.className = "attachment-progress profile-picture-progress"; pictureProgress.hidden = true;
      const pictureProgressFill = document.createElement("div"); pictureProgressFill.className = "attachment-progress-fill";
      pictureProgress.append(pictureProgressFill);
      const pictureStatus = document.createElement("p"); pictureStatus.className = "profile-status message-send-status"; pictureStatus.setAttribute("role", "status"); pictureStatus.setAttribute("aria-live", "polite");
      picturePicker.htmlFor = "edit-profile-picture";
      pictureInput.id = "edit-profile-picture";
      picturePicker.append(pictureInput);
      avatarUploadArea.append(picturePicker, pictureFileName, pictureProgress, pictureStatus);
      avatarEditorRow.append(avatarPreview, avatarUploadArea);
      avatarSection.append(avatarHeading, avatarEditorRow);
      form.append(avatarSection);
      const fullName=field("Full Name","full_name","text",profile.full_name||metadataValue(user,"full_name")||metadataValue(user,"name"));
      pictureInput.addEventListener("change", async () => {
        const file = pictureInput.files && pictureInput.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) { pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Please select an image file."; pictureInput.value = ""; return; }
        if (file.size > 10 * 1024 * 1024) { pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Image must be 10 MB or smaller."; pictureInput.value = ""; return; }
        pictureInput.disabled = true; picturePicker.classList.add("is-uploading"); pictureButton.textContent = "Processing…";
        pictureFileName.hidden = false; pictureFileName.textContent = file.name + " · " + formatProfileImageSize(file.size);
        pictureProgress.hidden = false; pictureProgress.classList.add("is-active"); pictureProgressFill.style.width = "35%";
        pictureStatus.style.color = "#245b8f"; pictureStatus.textContent = "Preparing your profile picture…";
        let objectUrl = "";
        try {
          const extension = profileImageExtension(file.type);
          if (!extension) throw new Error("Unsupported image format.");
          pictureStatus.textContent = "Saving your profile picture…"; pictureProgressFill.style.width = "70%";
          const signedAvatarUrl = await uploadProfileImageFile(user, file);
          pictureProgressFill.style.width = "100%"; pictureProgress.classList.remove("is-active");
          pictureStatus.style.color = "#176b43"; pictureStatus.textContent = "✓ Profile picture updated successfully.";
          avatarPreview.replaceChildren(); const previewImage = document.createElement("img"); previewImage.src = signedAvatarUrl; previewImage.alt = "Profile picture"; avatarPreview.append(previewImage);
          // The status message above is the single upload confirmation; no separate subtitle element is required.
        } catch (error) {
          pictureProgress.classList.remove("is-active"); pictureProgressFill.style.width = "0%";
          pictureStatus.style.color = "#a12622"; pictureStatus.textContent = "Could not update your profile picture. Please try another image.";
        } finally {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          pictureInput.disabled = false; picturePicker.classList.remove("is-uploading"); pictureButton.textContent = "Choose image"; pictureInput.value = "";
        }
      });
      field("Phone Number","phone","tel",profile.phone);
      field("Date of Birth","date_of_birth","date",profile.date_of_birth);
      field("Bio","bio","textarea",profile.bio);
      const status=document.createElement("p");status.className="profile-status";status.setAttribute("role","status");
      const actions=document.createElement("div");actions.className="profile-actions";
      const save=document.createElement("button");save.className="action-button primary";save.type="submit";save.textContent="Save Changes";
      const cancel=document.createElement("button");cancel.className="action-button";cancel.type="button";cancel.textContent="Cancel";
      cancel.addEventListener("click",()=>{renderPage("Profile");history.replaceState(null,"","#profile");});
      actions.append(save,cancel);form.append(status,actions);
      form.addEventListener("submit",async(event)=>{
        event.preventDefault();save.disabled=true;save.textContent="Saving...";
        const profileData = {
          id: user.id,
          full_name: fullName.value.trim(),
          phone: form.elements.phone.value.trim() || null,
          date_of_birth: form.elements.date_of_birth.value || null,
          bio: form.elements.bio.value.trim() || null,
          updated_at: new Date().toISOString()
        };
        const { error } = await supabaseClient.from("profiles").upsert(profileData, { onConflict: "id" });
        if(error){status.style.color="#a12622";status.textContent="Could not save your profile to the user table. Please try again.";save.disabled=false;save.textContent="Save Changes";return;}
        renderPage("Profile");history.replaceState(null,"","#profile");
      });
      page.append(heading,form);mainContent.replaceChildren(page);
    }

    // Keep menu actions synchronized with the real Supabase session.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      updateAuthMenu(session);
      const recoveryHash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const recoveryQuery = new URLSearchParams(window.location.search);
      if (session && event === "SIGNED_IN" &&
          window.location.hash.toLowerCase() !== "#forgot-password" &&
          !recoveryQuery.has("code") &&
          !(recoveryHash.get("type") === "recovery" && recoveryHash.has("access_token"))) {
        renderPage("Profile");
        history.replaceState(null, "", "#profile");
        setCurrentMenuPage("Profile");
      }
    });

    (async () => {
      const route = () => {
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        if (params.has("code") || params.has("error") ||
            (hashParams.get("type") === "recovery" && (hashParams.has("access_token") || hashParams.has("error")))) {
          return "#forgot-password";
        }
        return window.location.hash.toLowerCase() || "#home";
      };
      const openRoute = (session) => {
        updateAuthMenu(session);
        const currentRoute = route();
        if (currentRoute === "#home") {
          renderHome();
          setCurrentMenuPage("Home");
        } else if (currentRoute === "#profile") {
          if (session) {
            renderPage("Profile");
            setCurrentMenuPage("Profile");
          } else {
            renderPage("Login");
            history.replaceState(null, "", "#login");
            setCurrentMenuPage("Login");
          }
        } else if (currentRoute === "#edit-profile") {
          if (session) {
            renderPage("EditProfile");
            setCurrentMenuPage("Profile");
          } else {
            renderPage("Login");
            history.replaceState(null, "", "#login");
            setCurrentMenuPage("Login");
          }
        } else if (currentRoute === "#forgot-password") {
          renderPage("ForgotPassword");
          setCurrentMenuPage("ForgotPassword");
        } else if (currentRoute === "#login") {
          if (session) {
            renderPage("Profile");
            history.replaceState(null, "", "#profile");
            setCurrentMenuPage("Profile");
          } else {
            renderPage("Login");
            setCurrentMenuPage("Login");
          }
        } else if (currentRoute === "#dashboard" || currentRoute.startsWith("#dashboard-")) {
          if (session) {
            renderPage("Dashboard");
            setCurrentMenuPage("Profile");
          } else {
            renderPage("Login");
            history.replaceState(null, "", "#login");
            setCurrentMenuPage("Login");
          }
        } else if (currentRoute === "#create-account" && !session) {
          renderPage("CreateAccount");
          setCurrentMenuPage("CreateAccount");
        } else {
          renderPage("Login");
          history.replaceState(null, "", "#login");
          setCurrentMenuPage("Login");
        }
      };

      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        openRoute(data.session);
      } catch (error) {
        console.error("Could not initialize the page session:", error);
        updateAuthMenu(null);
        const currentRoute = route();
        if (currentRoute === "#login") {
          renderPage("Login");
          setCurrentMenuPage("Login");
        } else if (currentRoute === "#forgot-password" || new URLSearchParams(window.location.search).has("code")) {
          renderPage("ForgotPassword");
          setCurrentMenuPage("ForgotPassword");
        } else if (currentRoute === "#create-account") {
          renderPage("CreateAccount");
          setCurrentMenuPage("CreateAccount");
        } else {
          // Preserve the requested route where possible if session lookup fails.
          mainContent.replaceChildren();
          setCurrentMenuPage("Home");
        }
      }
    })();

    const refreshCurrentRoute = async () => {
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const currentRoute = params.has("code") ||
          (hashParams.get("type") === "recovery" && hashParams.has("access_token"))
          ? "#forgot-password"
          : (window.location.hash.toLowerCase() || "#home");
        if (currentRoute === "#home") {
          updateAuthMenu(data.session);
          renderHome();
          setCurrentMenuPage("Home");
        } else if (currentRoute === "#forgot-password") {
          updateAuthMenu(data.session);
          renderPage("ForgotPassword");
          setCurrentMenuPage("ForgotPassword");
        } else {
          const session = data.session;
          updateAuthMenu(session);
          if (currentRoute === "#profile" && !session) {
            renderPage("Login"); history.replaceState(null, "", "#login"); setCurrentMenuPage("Login");
          } else if (currentRoute === "#dashboard" || currentRoute.startsWith("#dashboard-")) {
            if (session) { renderPage("Dashboard"); setCurrentMenuPage("Profile"); }
            else { renderPage("Login"); history.replaceState(null, "", "#login"); setCurrentMenuPage("Login"); }
          } else if (currentRoute === "#create-account" && !session) {
            renderPage("CreateAccount"); setCurrentMenuPage("CreateAccount");
          } else if (currentRoute === "#login" && session) {
            renderPage("Profile"); history.replaceState(null, "", "#profile"); setCurrentMenuPage("Profile");
          } else if (currentRoute === "#edit-profile" && session) {
            renderPage("EditProfile"); setCurrentMenuPage("Profile");
          } else if (currentRoute === "#login") {
            renderPage("Login"); setCurrentMenuPage("Login");
          } else if (currentRoute === "#create-account") {
            renderPage("Login"); history.replaceState(null, "", "#login"); setCurrentMenuPage("Login");
          } else if (currentRoute === "#profile") {
            renderPage("Profile"); setCurrentMenuPage("Profile");
          } else {
            mainContent.replaceChildren(); history.replaceState(null, "", "#home"); setCurrentMenuPage("Home");
          }
        }
      } catch (error) {
        console.error("Could not restore the current route:", error);
      }
    };
    window.addEventListener("hashchange", refreshCurrentRoute);
    window.addEventListener("popstate", refreshCurrentRoute);

    menuLinks.forEach((link) => {
      link.addEventListener("click", async () => {
        const pageName = link.dataset.page;
        try {
          // Home is always directly reachable, regardless of authentication state.
          if (pageName === "Home") {
            renderHome();
            history.replaceState(null, "", "#home");
            setCurrentMenuPage("Home");
          } else if (pageName === "Logout") {
            link.disabled = true;
            link.textContent = "Logging out...";
            const { error } = await supabaseClient.auth.signOut();
            if (error) throw error;
            updateAuthMenu(null);
            renderPage("Login");
            history.replaceState(null, "", "#login");
            setCurrentMenuPage("Login");
          } else {
            let session = null;
            try {
              const { data, error } = await supabaseClient.auth.getSession();
              if (error) throw error;
              session = data.session;
            } catch (sessionError) {
              console.error("Could not check the session during navigation:", sessionError);
            }
            updateAuthMenu(session);
            if (session && (pageName === "Login" || pageName === "CreateAccount")) {
              renderPage("Profile");
              history.replaceState(null, "", "#profile");
              setCurrentMenuPage("Profile");
            } else {
              renderPage(pageName);
              history.replaceState(null, "", pageName === "Home" ? "#home" : "#" + pageName.toLowerCase());
              setCurrentMenuPage(pageName);
            }
          }
        } catch (error) {
          console.error("Menu navigation failed:", error);
          updateAuthMenu(null);
          renderPage("Login");
          history.replaceState(null, "", "#login");
          setCurrentMenuPage("Login");
        } finally {
          link.disabled = false;
          floatingMenu.hidden = true;
          menuButton.setAttribute("aria-expanded", "false");
          menuButton.setAttribute("aria-label", "Open menu");
          if (pageName === "Logout") link.textContent = "Login";
        }
      });
    });
  </script>

  <script>
    // Keep menu toggling and navigation functional even if the main app script fails.
    (() => {
      const menuButton = document.querySelector(".menu-button");
      const floatingMenu = document.querySelector("#floating-menu");
      if (!menuButton || !floatingMenu) return;

      const closeMenu = () => {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      };

      menuButton.addEventListener("click", () => {
        const isOpening = floatingMenu.hidden;
        floatingMenu.hidden = !isOpening;
        menuButton.setAttribute("aria-expanded", String(isOpening));
        menuButton.setAttribute("aria-label", isOpening ? "Close menu" : "Open menu");
      });

      document.addEventListener("click", (event) => {
        if (!menuButton.contains(event.target) && !floatingMenu.contains(event.target)) closeMenu();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMenu();
      });

    })();
  </script>
</body>
</html>
