<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: relative;
      z-index: 1;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(30, 40, 50, 0.08);
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    footer {
      flex: 0 0 80px;
      width: 100%;
      background-color: #f5f5f5;
      border-top: 1px solid #eeeeee;
    }
  </style>
</head>
<body>
  <header>
  </header>

  <main>
  </main>

  <footer>
  </footer>
</body>
</html>
