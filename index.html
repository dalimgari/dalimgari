<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="দালিমগাড়ী গ্রামের তথ্য, খবর, পোস্ট, অ্যালবাম ও কমিউনিটি ওয়েবসাইট।" />
    <link rel="canonical" href="https://dalimgari.github.io/dalimgari/" />
    <link rel="icon" type="image/svg+xml" href="/dalimgari/favicon.svg" />
    <title>হোম — কমিউনিটি ওয়েবসাইট</title>
    <script>
      (function () {
        try {
          var key = 'dalimgari_language_preference_v3'
          var saved = localStorage.getItem(key)
          if (saved !== 'bng' && saved !== 'eng') {
            localStorage.setItem(key, 'bng')
            document.documentElement.lang = 'bn'
          } else {
            document.documentElement.lang = saved === 'eng' ? 'en' : 'bn'
          }
        } catch (_) {
          document.documentElement.lang = 'bn'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
