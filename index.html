<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ডালিমগাড়ী</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #263238;
    }

    header {
      height: 60px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #d8dee6;
    }

    button {
      padding: 8px 12px;
      margin-left: 10px;
      border: 1px solid #c7d0da;
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      margin-right: 10px;
      border-radius: 50%;
      background: #c7d0da;
      border: 1px solid #aeb9c4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #263238;
    }

    #sidebar {
      width: 180px;
      height: calc(100vh - 61px);
      background: #e8eef5;
      border-right: 1px solid #d0d9e2;
      display: none;
    }

    #sidebar.open {
      display: block;
    }

    main {
      padding: 30px 20px;
      text-align: center;
    }

    main h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    main p {
      margin: 0;
      color: #607080;
    }
  </style>
</head>
<body>

  <header>
    <button type="button" id="menu-button">Menu</button>
    <button type="button" class="profile-avatar" aria-label="Profile">👤</button>
  </header>

  <aside id="sidebar"></aside>

  <main>
    <h1>দলিমগাড়ি</h1>
    <p>আমাদের গ্রামের ওয়েবসাইট</p>
  </main>

  <script>
    document.getElementById("menu-button").onclick = function () {
      document.getElementById("sidebar").classList.toggle("open");
    };
  </script>

</body>
</html>
