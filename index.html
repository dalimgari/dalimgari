<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
</head>
<body>

  <div id="header-component"></div>
  <div id="sidebar-component"></div>

  <script>
    async function loadComponent(containerId, filePath) {
      const response = await fetch(filePath);
      document.getElementById(containerId).innerHTML = await response.text();
    }

    async function loadHomeComponents() {
      await loadComponent("header-component", "global/components/header/header.html");
      await loadComponent("sidebar-component", "global/components/sidebar/sidebar.html");

      const headerCss = document.createElement("link");
      headerCss.rel = "stylesheet";
      headerCss.href = "global/components/header/header.css";
      document.head.appendChild(headerCss);

      const sidebarCss = document.createElement("link");
      sidebarCss.rel = "stylesheet";
      sidebarCss.href = "global/components/sidebar/sidebar.css";
      document.head.appendChild(sidebarCss);

      const profileCss = document.createElement("link");
      profileCss.rel = "stylesheet";
      profileCss.href = "global/components/profile-avatar/profile-avatar.css";
      document.head.appendChild(profileCss);

      const headerScript = document.createElement("script");
      headerScript.src = "global/components/header/header.js";
      document.body.appendChild(headerScript);

      const sidebarScript = document.createElement("script");
      sidebarScript.src = "global/components/sidebar/sidebar.js";
      sidebarScript.onload = function () {
        initSidebar();
      };
      document.body.appendChild(sidebarScript);
    }

    loadHomeComponents();
  </script>

</body>
</html>
