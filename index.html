<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    header {
      position: relative;
      z-index: 1;
      flex: 0 0 80px;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.16);
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background-color: #ffffff;
    }

    footer {
      position: relative;
      flex: 0 0 80px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      background-color: #fafafa;
      border-top: 1px solid #f0f0f0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.035);
      color: #777777;
      font-size: 13px;
      letter-spacing: 0.2px;
      text-align: center;
    }

    footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 44px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background-color: #e5e5e5;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <header>
  </header>

  <main>
  </main>

  <footer>
    © 2026 Dalimgari. All rights reserved.
  </footer>
</body>
</html>
