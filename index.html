<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dalimgari</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111;color:#fff}
    #app{min-height:100vh}
    [data-context-slot="header"]{position:fixed;top:0;left:0;right:0;z-index:1100;min-height:64px}
    [data-context-slot="sidebar"]{position:relative}
    [data-context-slot="content"]{min-height:calc(100vh - 64px);min-width:0;padding-top:64px;box-sizing:border-box}
  </style>
</head>
<body>
  <div id="app">
    <div data-context-slot="header"></div>
    <div data-context-slot="sidebar"></div>
    <div data-context-slot="content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="platform/web/adapter/config.js"></script>
  <script src="core/registry/registry.js"></script>
  <script src="core/definition/definition.js"></script>
  <script src="core/controller/controller.js"></script>
  <script src="core/controller/auth.js"></script>
  <script src="platform/web/adapter/adapter.js"></script>
  <script src="platform/web/adapter/supabase.js"></script>
  <script src="platform/web/renderer/renderer.js"></script>
  <script src="platform/web/entry/entry.js"></script>
</body>
</html>
