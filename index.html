<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalimgari</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="preload" href="app.js" as="script">
</head>
<body>
  <header id="site-header" data-layout-section="header"></header>
  <main id="main-content" aria-live="polite"></main>
  <footer id="site-footer" data-layout-section="footer">© 2026 Dalimgari. All rights reserved.</footer>

  <script>
    // Start the data SDK and layout fetches together, but do not make the layout wait for the SDK.
    (async () => {
      const headerHost = document.getElementById("site-header");
      const footerHost = document.getElementById("site-footer");
      const mainContent = document.getElementById("main-content");

      const loadScript = (src) => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = new URL(src, document.baseURI).href;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Could not load required script: " + src));
        document.body.appendChild(script);
      });

      const showContentError = (message) => {
        const errorMessage = document.createElement("p");
        errorMessage.setAttribute("role", "alert");
        errorMessage.style.cssText = "margin:24px;padding:16px";
        errorMessage.textContent = message;
        mainContent.replaceChildren(errorMessage);
      };

      let layoutMounted = false;
      try {
        // SDK download proceeds while the independent layout components are fetched.
        const sdkResultPromise = loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2")
          .then(() => ({ ok: true }), error => ({ ok: false, error }));

        const [headerResponse, footerResponse] = await Promise.all([
          fetch(new URL("header.html", document.baseURI), { credentials: "same-origin" }),
          fetch(new URL("footer.html", document.baseURI), { credentials: "same-origin" })
        ]);
        if (!headerResponse.ok || !footerResponse.ok) {
          throw new Error("A layout component could not be loaded.");
        }

        const [headerMarkup, footerMarkup] = await Promise.all([
          headerResponse.text(),
          footerResponse.text()
        ]);
        headerHost.innerHTML = headerMarkup;
        footerHost.innerHTML = footerMarkup;
        layoutMounted = true;

        // Give the content area an immediate, accessible loading state while data initializes.
        const loadingMessage = document.createElement("p");
        loadingMessage.setAttribute("role", "status");
        loadingMessage.textContent = "Loading content…";
        loadingMessage.style.cssText = "width:min(100% - 32px,760px);margin:24px auto;padding:12px 0";
        mainContent.replaceChildren(loadingMessage);

        // The menu is independent of Supabase and can work while the SDK is still downloading.
        await loadScript("header.js");

        const sdkResult = await sdkResultPromise;
        if (!sdkResult.ok) throw sdkResult.error;
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          throw new Error("The Supabase SDK did not initialize correctly.");
        }

        // Start application/data code only after the shell and SDK are ready.
        await loadScript("app.js");
      } catch (error) {
        console.error("Site initialization failed:", error);
        // Keep any successfully mounted header/footer visible if Supabase or app.js fails.
        showContentError(layoutMounted
          ? "Content could not be loaded. Please check your connection and refresh the page."
          : "The page layout could not be initialized. Please refresh the page and try again.");
      }
    })();
  </script>
</body>
</html>
