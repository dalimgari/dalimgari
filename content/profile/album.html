<section class="profile-tab-panel" data-profile-section="album">
<div class="profile-crud" data-crud="albums">
    <h2>Album</h2>
    <form class="profile-crud__form" data-crud-form>
        <input type="hidden" name="id">
        <label class="field"><span>Name</span><input name="name" maxlength="180" required></label>
        <label class="field"><span>Description</span><textarea name="description" rows="3" maxlength="1000"></textarea></label>
        <label class="field"><span>Visibility</span><select name="visibility"><option value="public">Public</option><option value="members">Members</option></select></label>
        <div class="profile-card__footer"><button class="button button--primary" type="submit" data-action-save>Create Album</button><button class="button" type="button" data-action-cancel hidden>Cancel</button></div>
    </form>
    <output class="form-message" data-crud-message aria-live="polite"></output>
    <div data-crud-list></div>
</div>
</section>
