<section class="profile-tab-panel" data-profile-section="post">
<div class="profile-crud" data-crud="posts">
    <h2>Post</h2>
    <form class="profile-crud__form" data-crud-form>
        <input type="hidden" name="id">
        <label class="field"><span>Post</span><textarea name="content" rows="5" maxlength="5000" required placeholder="Write your post..."></textarea></label>
        <label class="field"><span>Visibility</span><select name="visibility"><option value="public">Public</option><option value="members">Members</option></select></label>
        <div class="profile-card__footer"><button class="button button--primary" type="submit" data-action-save>Create Post</button><button class="button" type="button" data-action-cancel hidden>Cancel</button></div>
    </form>
    <output class="form-message" data-crud-message aria-live="polite"></output>
    <div data-crud-list></div>
</div>
</section>
