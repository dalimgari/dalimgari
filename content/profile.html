<section class="page page-profile" data-page="profile">
    <div class="profile-card">
        <header class="profile-card__hero" data-profile-area="identity">
            <div class="profile-card__avatar" data-component="avatar"></div>
            <div class="profile-card__identity">
                <h1 data-profile-name>Profile</h1>
                <span class="profile-role" data-profile-type>Member</span>
            </div>
        </header>

        <nav class="profile-tabs" role="tablist" aria-label="Profile sections">
            <button type="button" class="profile-tab is-active" role="tab" aria-selected="true" aria-controls="profile-tab-overview" tabindex="0" data-profile-tab="overview">Overview</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-post" tabindex="-1" data-profile-tab="post">Post</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-photo" tabindex="-1" data-profile-tab="photo">Photo</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-video" tabindex="-1" data-profile-tab="video">Video</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-album" tabindex="-1" data-profile-tab="album">Album</button>
            <button type="button" class="profile-tab is-owner-control" role="tab" aria-selected="false" aria-controls="profile-tab-settings" tabindex="-1" data-profile-tab="settings" data-requires-owner data-requires-auth>Settings</button>
        </nav>

        <main class="profile-content">
            <section id="profile-tab-overview" class="profile-tab-panel is-active" role="tabpanel" data-profile-panel="overview">
                <div class="profile-card__body">
                    <div class="profile-stat"><span>Email</span><strong data-profile-email>—</strong></div>
                    <div class="profile-stat"><span>Status</span><strong data-profile-status>—</strong></div>
                    <div class="profile-stat"><span>Role</span><strong data-profile-type>Member</strong></div>
                    <div class="profile-stat"><span>Bio</span><strong data-profile-bio>—</strong></div>
                </div>
            </section>

            <section id="profile-tab-post" class="profile-tab-panel" role="tabpanel" data-profile-panel="post" hidden>
                <div class="profile-tab-section">
                    <h2>Post</h2>
                    <p>Create, view, edit and delete your posts.</p>
                </div>
            </section>

            <section id="profile-tab-photo" class="profile-tab-panel" role="tabpanel" data-profile-panel="photo" hidden>
                <div class="profile-tab-section">
                    <h2>Photo</h2>
                    <p>Create, view, edit and delete your photos.</p>
                </div>
            </section>

            <section id="profile-tab-video" class="profile-tab-panel" role="tabpanel" data-profile-panel="video" hidden>
                <div class="profile-tab-section">
                    <h2>Video</h2>
                    <p>Create, view, edit and delete your videos.</p>
                </div>
            </section>

            <section id="profile-tab-album" class="profile-tab-panel" role="tabpanel" data-profile-panel="album" hidden>
                <div class="profile-tab-section">
                    <h2>Album</h2>
                    <p>Create, view, edit and delete your albums.</p>
                </div>
            </section>

            <section id="profile-tab-settings" class="profile-tab-panel" role="tabpanel" data-profile-panel="settings" hidden data-requires-owner data-requires-auth>
                <form class="profile-edit" data-profile-form>
                    <div class="profile-edit__grid"><label class="field"><span>Bio</span><textarea name="bio" rows="4" maxlength="500" data-profile-bio-input></textarea></label></div>
                    <output class="form-message" data-auth-message aria-live="polite"></output>
                    <div class="profile-card__footer"><button class="button button--primary" type="submit">Save changes</button></div>
                </form>
            </section>
        </main>
    </div>
</section>
