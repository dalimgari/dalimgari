<section class="page page-profile" data-page="profile">
    <div class="profile-card">
        <header class="profile-card__hero">
            <div class="profile-card__avatar" data-component="avatar"></div>
            <div class="profile-card__identity">
                <h1 data-profile-name>Profile</h1>
                <span class="profile-role" data-profile-type>Member</span>
            </div>
        </header>

        <nav class="profile-tabs" role="tablist" aria-label="Profile sections">
            <button type="button" class="profile-tab is-active" role="tab" aria-selected="true" aria-controls="profile-tab-overview" data-profile-tab="overview">Overview</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-posts" data-profile-tab="posts">Posts</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-activity" data-profile-tab="activity">Activity</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-media" data-profile-tab="media">Media</button>
            <button type="button" class="profile-tab" role="tab" aria-selected="false" aria-controls="profile-tab-contributions" data-profile-tab="contributions">Contributions</button>
            <button type="button" class="profile-tab is-owner-control" role="tab" aria-selected="false" aria-controls="profile-tab-settings" data-profile-tab="settings" data-requires-owner data-requires-auth>Settings</button>
        </nav>

        <main class="profile-content">
            <section id="profile-tab-overview" class="profile-tab-panel is-active" role="tabpanel" data-profile-panel="overview">
                <div class="profile-card__body" data-profile-view>
                    <div class="profile-stat"><span>Email</span><strong data-profile-email>—</strong></div>
                    <div class="profile-stat"><span>Status</span><strong data-profile-status>—</strong></div>
                    <div class="profile-stat"><span>Role</span><strong data-profile-type>Member</strong></div>
                    <div class="profile-stat"><span>Bio</span><strong data-profile-bio>—</strong></div>
                </div>
            </section>

            <section id="profile-tab-posts" class="profile-tab-panel" role="tabpanel" data-profile-panel="posts" hidden>
                <div class="profile-posts" data-profile-posts data-user-posts-order="newest-first">
                    <div class="profile-tab-empty"><h2>Posts</h2><p>Your newest posts will appear here first.</p></div>
                </div>
            </section>

            <section id="profile-tab-activity" class="profile-tab-panel" role="tabpanel" data-profile-panel="activity" hidden>
                <div class="profile-tab-empty"><h2>Activity</h2><p>Your visible community activity will appear here.</p></div>
            </section>

            <section id="profile-tab-media" class="profile-tab-panel" role="tabpanel" data-profile-panel="media" hidden>
                <div class="profile-tab-empty"><h2>Media</h2><p>Your published photos and videos will appear here.</p></div>
            </section>

            <section id="profile-tab-contributions" class="profile-tab-panel" role="tabpanel" data-profile-panel="contributions" hidden>
                <div class="profile-tab-empty"><h2>Contributions</h2><p>Your approved community contributions will appear here.</p></div>
            </section>

            <section id="profile-tab-settings" class="profile-tab-panel" role="tabpanel" data-profile-panel="settings" hidden data-requires-owner data-requires-auth>
                <form class="profile-edit" data-profile-form>
                    <div class="profile-edit__grid">
                        <label class="field"><span>Bio</span><textarea name="bio" rows="4" maxlength="500" data-profile-bio-input></textarea></label>
                    </div>
                    <output class="form-message" data-auth-message aria-live="polite"></output>
                    <div class="profile-card__footer">
                        <button class="button button--primary" type="submit">Save changes</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</section>
