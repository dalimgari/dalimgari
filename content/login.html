<section data-page="login" aria-labelledby="login-title">
  <h1 id="login-title">Login</h1>

  <form data-auth-form="login">
    <p>
      <button type="button" data-auth-action="google">Continue with Google</button>
    </p>

    <p>
      <input id="login-identifier" name="identifier" type="text" autocomplete="username" placeholder="Email / Phone Number" required>
    </p>

    <p>
      <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
    </p>

    <p>
      <button type="submit">Login</button>
    </p>
  </form>

  <nav aria-label="Login options">
    <p><a data-content-link href="content/forgot-password.html">Forgot Password</a></p>
    <p><a data-content-link href="content/create-account.html">Create Account</a></p>
  </nav>
</section>
