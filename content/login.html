<section data-page="login" aria-labelledby="login-title">
  <h1 id="login-title">Login</h1>

  <form>
    <p>
      <button type="button">Continue with Google</button>
    </p>

    <p>
      <label for="login-identifier">Email / Phone Number</label><br>
      <input id="login-identifier" name="identifier" type="text" autocomplete="username" required>
    </p>

    <p>
      <label for="login-password">Password</label><br>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </p>

    <p>
      <button type="submit">Login</button>
    </p>
  </form>

  <nav aria-label="Login options">
    <p><a href="forgot-password.html">Forgot Password</a></p>
    <p><a href="create-account.html">Create Account</a></p>
  </nav>
</section>
