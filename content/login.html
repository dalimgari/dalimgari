<section class="page page-auth" data-page="login">
    <div class="auth-card">
        <div class="auth-card__header">
            <span class="eyebrow">Welcome back</span>
            <h1>Sign in</h1>
            <p>Use your email or phone number to continue.</p>
        </div>
        <form data-auth-form="login" novalidate>
            <div class="field">
                <label for="login-identifier">Email or phone</label>
                <input id="login-identifier" name="identifier" type="text" autocomplete="username" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <div class="field__row">
                    <label for="login-password">Password</label>
                    <a class="text-link text-link--small" href="#content/forgot-password.html" data-route="content/forgot-password.html">Forgot password?</a>
                </div>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button button--primary button--full" type="submit">Sign in</button>
            <div class="auth-divider"><span>or</span></div>
            <button class="button button--secondary button--full" type="button" data-auth-action="google">Continue with Google</button>
            <output class="form-message" data-auth-message aria-live="polite"></output>
        </form>
        <p class="auth-card__footer">Don't have an account? <a class="text-link" href="#content/create-account.html" data-route="content/create-account.html">Create one</a></p>
    </div>
</section>
