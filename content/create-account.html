<section class="page page-auth" data-page="create-account">
    <div class="auth-card">
        <div class="auth-card__header">
            <span class="eyebrow">Join the community</span>
            <h1>Create your account</h1>
            <p>Set up your account in a few steps.</p>
        </div>
        <form data-auth-form="signup" novalidate>
            <div class="field">
                <label for="signup-name">Name</label>
                <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
            </div>
            <div class="field">
                <label for="signup-identifier">Email or phone</label>
                <input id="signup-identifier" name="identifier" type="text" autocomplete="username" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="signup-password">Password</label>
                <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                <small class="field__hint">Use at least 8 characters.</small>
            </div>
            <div class="field">
                <label for="signup-confirm-password">Confirm password</label>
                <input id="signup-confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="button button--primary button--full" type="submit">Create account</button>
            <output class="form-message" data-auth-message aria-live="polite"></output>
        </form>
        <p class="auth-card__footer">Already have an account? <a class="text-link" href="#content/login.html" data-route="content/login.html">Sign in</a></p>
    </div>
</section>
