<section data-page="create-account" aria-labelledby="create-account-title">
  <h1 id="create-account-title">Create Account</h1>

  <form>
    <p>
      <label for="account-name">Name</label><br>
      <input id="account-name" name="name" type="text" autocomplete="name" required>
    </p>

    <p>
      <label for="account-email">Email</label><br>
      <input id="account-email" name="email" type="email" autocomplete="email" required>
    </p>

    <p>
      <label for="account-phone">Phone Number</label><br>
      <input id="account-phone" name="phone" type="tel" autocomplete="tel" required>
    </p>

    <p>
      <label for="account-password">Password</label><br>
      <input id="account-password" name="password" type="password" autocomplete="new-password" required>
    </p>

    <p>
      <label for="account-confirm-password">Confirm Password</label><br>
      <input id="account-confirm-password" name="confirm-password" type="password" autocomplete="new-password" required>
    </p>

    <p>
      <button type="submit">Create Account</button>
    </p>
  </form>
</section>
