<section data-page="create-account" aria-labelledby="create-account-title">
  <h1 id="create-account-title">Create Account</h1>

  <form data-auth-form="signup">
    <p>
      <input id="account-name" name="name" type="text" autocomplete="name" placeholder="Name" required>
    </p>

    <p>
      <input id="account-identifier" name="identifier" type="text" autocomplete="username" placeholder="Email / Phone Number" required>
    </p>

    <p>
      <input id="account-password" name="password" type="password" autocomplete="new-password" placeholder="Password" required>
    </p>

    <p>
      <input id="account-confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Confirm Password" required>
    </p>

    <p>
      <button type="submit">Create Account</button>
    </p>
  </form>
</section>
