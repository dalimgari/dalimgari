<section class="page page-auth" data-page="forgot-password">
    <div class="auth-card">
        <div class="auth-card__header">
            <span class="eyebrow">Account recovery</span>
            <h1>Reset your password</h1>
            <p data-recovery-status aria-live="polite">Enter your email to receive a reset link.</p>
        </div>
        <form data-auth-form="password-reset-request" novalidate>
            <div class="field">
                <label for="reset-email">Email</label>
                <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <button class="button button--primary button--full" type="submit">Send reset link</button>
            <output class="form-message" data-auth-message aria-live="polite"></output>
        </form>
        <form data-auth-form="password-update" hidden novalidate>
            <div class="field">
                <label for="reset-password">New password</label>
                <input id="reset-password" name="reset-password" type="password" autocomplete="new-password" minlength="8" required>
                <small class="field__hint">Use at least 8 characters.</small>
            </div>
            <button class="button button--primary button--full" type="submit">Update password</button>
            <output class="form-message" data-auth-message aria-live="polite"></output>
        </form>
        <p class="auth-card__footer"><a class="text-link" href="#content/login.html" data-route="content/login.html">← Back to sign in</a></p>
    </div>
</section>
