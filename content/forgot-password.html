<section data-page="forgot-password" aria-labelledby="forgot-password-title">
  <h1 id="forgot-password-title">Forgot Password</h1>

  <form>
    <p>
      <label for="reset-email">Email</label><br>
      <input id="reset-email" name="email" type="email" autocomplete="email" required>
    </p>

    <p>
      <button type="submit">Send Verification / Reset Request</button>
    </p>
  </form>

  <form>
    <p>
      <label for="verification-code">Verification Code</label><br>
      <input id="verification-code" name="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code">
    </p>

    <p>
      <button type="submit">Verify Code</button>
    </p>
  </form>

  <form>
    <p>
      <label for="reset-password">Reset Password</label><br>
      <input id="reset-password" name="reset-password" type="password" autocomplete="new-password">
    </p>

    <p>
      <button type="submit">Reset Password</button>
    </p>
  </form>
</section>
