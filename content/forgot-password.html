<section data-page="forgot-password" aria-labelledby="forgot-password-title">
  <h1 id="forgot-password-title">Forgot Password</h1>

  <form data-auth-form="password-reset-request">
    <p>
      <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="Email" required>
    </p>

    <p>
      <button type="submit">Send Password Reset Link</button>
    </p>
  </form>

  <form data-auth-form="password-update">
    <p>
      <input id="reset-password" name="reset-password" type="password" autocomplete="new-password" placeholder="New Password" required>
    </p>

    <p>
      <button type="submit">Reset Password</button>
    </p>
  </form>
</section>
