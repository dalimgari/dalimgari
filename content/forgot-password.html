<section class="page page-forgot-password" data-page="forgot-password">
    <h1>Forgot password</h1>

    <form data-auth-form="password-reset-request">
        <label for="reset-email">Email</label>
        <input id="reset-email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Send reset link</button>
        <output data-auth-message aria-live="polite"></output>
    </form>

    <form data-auth-form="password-update">
        <label for="reset-password">New password</label>
        <input id="reset-password" name="reset-password" type="password" autocomplete="new-password" required>
        <button type="submit">Update password</button>
        <output data-auth-message aria-live="polite"></output>
    </form>
</section>
