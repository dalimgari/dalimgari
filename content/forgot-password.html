<section data-page="forgot-password" aria-labelledby="forgot-password-title">
  <h1 id="forgot-password-title">Forgot Password</h1>

  <form>
    <p>
      <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="Email" required>
    </p>

    <p>
      <button type="submit">Send Verification / Reset Request</button>
    </p>
  </form>

  <form>
    <p>
      <input id="verification-code" name="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Verification Code">
    </p>

    <p>
      <button type="submit">Verify Code</button>
    </p>
  </form>

  <form>
    <p>
      <input id="reset-password" name="reset-password" type="password" autocomplete="new-password" placeholder="Reset Password">
    </p>

    <p>
      <button type="submit">Reset Password</button>
    </p>
  </form>
</section>
