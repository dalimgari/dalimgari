-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home content template</title>
</head>
<body>
  <section class="home-page" aria-label="Home page sections">
    <section class="home-section home-hero" aria-label="Hero"></section>
    <nav class="home-page-pillbar" aria-label="Page Pill Button" hidden></nav>
    <section class="home-section home-album" aria-label="Album"></section>
    <section class="home-section home-widget" aria-label="Widget"></section>
    <section class="home-section home-page-card" aria-label="Page Section"></section>
  </section>
</body>
</html>
