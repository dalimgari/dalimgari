<!--
  Homepage content template.
  index.html retains the shared site header, navigation, main content area, footer,
  theme system, and shared JavaScript/data integrations. This file owns the homepage
  section structure; index.html populates these sections with the existing live data.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home content template</title>
</head>
<body>
  <section class="home-page" aria-label="Home page sections" style="width:100%;max-width:1200px;min-height:1px;margin:0 auto;padding:0 16px 32px">
    <section class="home-section home-hero" aria-label="Hero" style="width:100%;min-width:0;max-width:100%;padding:24px 0 32px"></section>
    <nav class="home-page-pillbar" aria-label="Pages" hidden style="position:sticky;top:var(--dg-page-pill-sticky-top,104px);z-index:9;display:flex;flex-wrap:nowrap;align-items:center;gap:10px;width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 2px 10px;background:#fff;border-radius:12px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#c7c7c7 #f5f5f5"></nav>
    <section class="home-section home-page-title" aria-label="Page Title" style="width:100%;min-width:0;max-width:100%;min-height:1px;padding:0 0 24px;box-sizing:border-box"></section>
    <section class="home-section home-widget" aria-label="Widget" style="width:100%;min-width:0;max-width:100%;min-height:1px;padding:0 0 24px;box-sizing:border-box"></section>
    <section class="home-section home-album" aria-label="Album" style="width:100%;min-width:0;max-width:100%;min-height:1px;padding:0 0 24px;box-sizing:border-box"></section>
    <section class="home-section home-page-card" aria-label="Page Card" style="width:100%;min-width:0;max-width:100%;min-height:1px;padding:0 0 24px;box-sizing:border-box"></section>
  </section>
</body>
</html>
