<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ডালিমগাড়ী</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #263238;
    }

    .login-page {
      max-width: 360px;
      margin: 60px auto;
      padding: 20px;
    }

    .login-page h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-page label {
      display: block;
      margin-bottom: 6px;
    }

    .login-page input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #c7d0da;
      border-radius: 4px;
    }

    .password-row {
      position: relative;
    }

    .password-row input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 7px;
      padding: 3px 6px;
      margin: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .login-button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 4px;
      background: #607080;
      color: #fff;
      cursor: pointer;
    }

    .login-links {
      margin-top: 15px;
      text-align: center;
    }

    .login-links a {
      display: block;
      margin: 8px 0;
      color: #405a70;
      text-decoration: none;
    }

    #login-message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="login-page">
    <h1>Login</h1>

    <form id="login-form">
      <label for="email-or-phone">Email / মোবাইল নম্বর</label>
      <input
        type="text"
        id="email-or-phone"
        name="email-or-phone"
        placeholder="Email বা মোবাইল নম্বর"
        required
      >

      <label for="password">Password</label>
      <div class="password-row">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          required
        >
        <button type="button" class="show-password" id="show-password">Show</button>
      </div>

      <button type="submit" class="login-button">Login</button>
    </form>

    <div class="login-links">
      <a href="#">Forgot Password?</a>
      <a href="#">Create Account / Register</a>
    </div>

    <p id="login-message"></p>
  </main>

  <script>
    document.getElementById("show-password").onclick = function () {
      const password = document.getElementById("password");

      if (password.type === "password") {
        password.type = "text";
        this.textContent = "Hide";
      } else {
        password.type = "password";
        this.textContent = "Show";
      }
    };

    document.getElementById("login-form").onsubmit = function (event) {
      event.preventDefault();

      const emailOrPhone = document.getElementById("email-or-phone").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("login-message");

      if (!emailOrPhone || !password) {
        message.textContent = "Email/মোবাইল নম্বর এবং Password দিন।";
        return;
      }

      message.textContent = "Login তথ্য যাচাই করা হবে।";
    };
  </script>

</body>
</html>
