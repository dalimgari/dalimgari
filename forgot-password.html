<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening Password Recovery | Dalimgari</title>
  <script>
    // Keep older password-reset email links working, but render the flow in index.html.
    (() => {
      const target = new URL("index.html", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash || "#forgot-password";
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Opening password recovery…</p>
  <noscript>
    <p>JavaScript is required to open password recovery. <a href="index.html#forgot-password">Continue to Forgot Password</a>.</p>
  </noscript>
</body>
</html>
