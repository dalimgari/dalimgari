<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Dalimgari</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #222222;
      font-family: Arial, sans-serif;
    }
    header {
      position: relative;
      flex: 0 0 80px;
      margin: 12px 16px 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 20px -8px rgba(0,0,0,.16);
    }
    .current-page-label {
      min-width: 0;
      margin: 0 auto 0 0;
      padding-right: 16px;
      color: #222222;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .menu-button {
      width: 44px; height: 44px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px; padding: 0;
      border: 0; border-radius: 10px; background: transparent; cursor: pointer;
    }
    .menu-button:hover, .menu-button:focus-visible { background: #f5f5f5; outline: none; }
    .menu-button span { display: block; width: 20px; height: 2px; border-radius: 2px; background: #333333; }
    .floating-menu {
      position: absolute; z-index: 5; top: calc(100% + 10px); right: 0;
      width: min(260px, calc(100vw - 32px)); padding: 8px;
      border: 1px solid #eeeeee; border-radius: 14px; background: #ffffff;
      box-shadow: 0 12px 32px rgba(0,0,0,.14);
    }
    .floating-menu[hidden], .menu-link[hidden] { display: none; }
    .menu-link {
      display: block; width: 100%; padding: 13px 14px; border: 0;
      border-radius: 9px; background: transparent; color: #333333;
      font: inherit; font-size: 15px; text-align: left; text-decoration: none; cursor: pointer;
    }
    .menu-link:hover, .menu-link:focus-visible { background: #f3f4f6; color: #111827; outline: none; }
    main {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    .description { margin: 0 0 24px; color: #666666; font-size: 14px; line-height: 1.6; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input {
      display: block;
      width: 100%;
      height: 48px;
      margin-bottom: 16px;
      padding: 0 14px;
      border: 1px solid #dcdcdc;
      border-radius: 9px;
      font: inherit;
      font-size: 15px;
    }
    input:focus { border-color: #777777; outline: 2px solid rgba(0,0,0,.06); }
    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #444444; }
    button:disabled { cursor: wait; opacity: .65; }
    .message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 16px 0 0;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .message:empty { display: none; }
    .message[data-type="error"] { color: #a12622; background: #fff4f2; border-color: #f6d5d1; }
    .message[data-type="error"]::before { content: "×"; font-weight: 700; }
    .message[data-type="success"] { color: #176b43; background: #effaf3; border-color: #ccebd7; }
    .message[data-type="success"]::before { content: "✓"; font-weight: 700; }
    .message[data-type="info"] { color: #245b8f; background: #f1f7ff; border-color: #d7e8fb; }
    .message[data-type="info"]::before { content: "i"; font-weight: 700; }
    .back { display: block; margin-top: 20px; color: #333333; font-size: 14px; text-align: center; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    footer {
      padding: 16px;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      color: #777777;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="current-page-label" id="current-page-label" aria-live="polite">Forgot Password</span>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="floating-menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="floating-menu" id="floating-menu" aria-label="Main menu" hidden>
      <a class="menu-link" href="index.html#home">Home</a>
      <a class="menu-link" href="index.html#profile">Profile</a>
      <a class="menu-link" href="index.html#login">Login</a>
    </nav>
  </header>
  <main>
    <section class="card" aria-live="polite">
      <h1 id="page-title">Forgot password?</h1>
      <p class="description" id="page-description">Enter the email address linked to your account. If it is registered, a password-reset link will be sent.</p>
      <form id="recovery-form">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <button id="submit-button" type="submit">Check Account</button>
      </form>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <a class="back" href="index.html#login">Back to Login</a>
    </section>
  </main>
  <footer>© 2026 Dalimgari. All rights reserved.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://yopfogoyjxwxplnabqii.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGZvZ295anh3eHBsbmFicWlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTMyNjQsImV4cCI6MjEwNDg2OTI2NH0.dIVH8sp3qyD_AGmt1bNFVOpQKdrgcX734HkrEuOacB4"
    );

    const menuButton = document.querySelector(".menu-button");
    const floatingMenu = document.querySelector("#floating-menu");
    menuButton.addEventListener("click", () => {
      const isOpening = floatingMenu.hidden;
      floatingMenu.hidden = !isOpening;
      menuButton.setAttribute("aria-expanded", String(isOpening));
      menuButton.setAttribute("aria-label", isOpening ? "Close menu" : "Open menu");
    });
    document.addEventListener("click", (event) => {
      if (!menuButton.contains(event.target) && !floatingMenu.contains(event.target)) {
        floatingMenu.hidden = true;
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Open menu");
      }
    });

    const form = document.querySelector("#recovery-form");
    const title = document.querySelector("#page-title");
    const currentPageLabel = document.querySelector("#current-page-label");
    const description = document.querySelector("#page-description");
    const emailInput = document.querySelector("#email");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#message");

    function setStatus(text, type) {
      message.dataset.type = type;
      message.textContent = text;
    }

    function showResetForm() {
      title.textContent = "Reset password";
      currentPageLabel.textContent = "Reset Password";
      description.textContent = "Enter a new password for your account.";
      form.replaceChildren();

      const label = document.createElement("label");
      label.htmlFor = "new-password";
      label.textContent = "New Password";

      const password = document.createElement("input");
      password.id = "new-password";
      password.name = "new-password";
      password.type = "password";
      password.placeholder = "New password (at least 8 characters)";
      password.autocomplete = "new-password";
      password.minLength = 8;
      password.required = true;

      const confirmLabel = document.createElement("label");
      confirmLabel.htmlFor = "confirm-password";
      confirmLabel.textContent = "Confirm New Password";

      const confirmPassword = document.createElement("input");
      confirmPassword.id = "confirm-password";
      confirmPassword.name = "confirm-password";
      confirmPassword.type = "password";
      confirmPassword.placeholder = "Re-enter new password";
      confirmPassword.autocomplete = "new-password";
      confirmPassword.minLength = 8;
      confirmPassword.required = true;

      const submit = document.createElement("button");
      submit.type = "submit";
      submit.textContent = "Save New Password";
      form.append(label, password, confirmLabel, confirmPassword, submit);
      message.textContent = "";
      message.removeAttribute("data-type");

      form.onsubmit = async (event) => {
        event.preventDefault();
        if (password.value.length < 8) {
          setStatus("Use at least 8 characters for your password.", "error");
          return;
        }
        if (password.value !== confirmPassword.value) {
          setStatus("Passwords don’t match. Please try again.", "error");
          confirmPassword.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = "Saving...";
        message.textContent = "";

        const { error } = await supabaseClient.auth.updateUser({ password: password.value });
        if (error) {
          setStatus("We couldn’t update your password. Please try again.", "error");
          submit.disabled = false;
          submit.textContent = "Save New Password";
          return;
        }

        title.textContent = "Password updated";
        currentPageLabel.textContent = "Password Updated";
        description.textContent = "Your password has been changed successfully. You can now return to the login page.";
        sessionStorage.removeItem("dalimgari-password-recovery");
        history.replaceState(null, "", window.location.pathname);
        form.replaceChildren();
        message.textContent = "";
      };
    }

    form.addEventListener("submit", async (event) => {
      if (title.textContent === "Reset password") return;
      event.preventDefault();

      if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        return;
      }

      button.disabled = true;
      button.textContent = "Checking...";
      message.textContent = "";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        emailInput.value.trim(),
        { redirectTo: "https://dalimgari.github.io/dalimgari/forgot-password.html" }
      );

      // Supabase intentionally avoids revealing whether an email is registered.
      // Use a generic response to prevent account enumeration.
      if (error) {
        setStatus("Couldn’t send the reset email. Please wait a little and try again.", "error");
      } else {
        setStatus("If this email is registered, a reset link will arrive shortly. Check your inbox and spam folder.", "success");
      }

      button.disabled = false;
      button.textContent = "Check Account";
    });

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") showResetForm();
    });

    // Handle Supabase recovery links using either the implicit-token or PKCE flow.
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const recoveryStorageKey = "dalimgari-password-recovery";
      const hasSavedRecoveryState = sessionStorage.getItem(recoveryStorageKey) === "true";
      const isRecoveryLink = params.has("code") ||
        (hashParams.get("type") === "recovery" && hashParams.has("access_token")) ||
        hasSavedRecoveryState;
      const { data: currentSession } = await supabaseClient.auth.getSession();
      if (currentSession.session && !isRecoveryLink) {
        window.location.replace("index.html#profile");
        return;
      }
      if (params.has("code")) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(params.get("code"));
        if (error) {
          sessionStorage.removeItem(recoveryStorageKey);
          setStatus("This reset link has expired. Request a new one.", "error");
          return;
        }
        sessionStorage.setItem(recoveryStorageKey, "true");
        history.replaceState(null, "", window.location.pathname);
        showResetForm();
      } else if (hashParams.get("type") === "recovery" && hashParams.has("access_token")) {
        sessionStorage.setItem(recoveryStorageKey, "true");
        showResetForm();
      } else if (hasSavedRecoveryState && currentSession.session) {
        showResetForm();
      } else if (params.has("error") || hashParams.has("error")) {
        sessionStorage.removeItem(recoveryStorageKey);
        message.textContent = "This password-reset link is invalid or has expired. Request a new reset email.";
      }
    })();
  </script>
</body>
</html>
